name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Check version consistency
      run: python scripts/bump_version.py --check

    # Advisory only. The release bump is derived from these prefixes, so an
    # unreadable one silently changes the version that ships - but a wording
    # nit must never block a merge.
    - name: Audit commit prefixes
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=50 origin "$BASE_REF"
        python scripts/bump_version.py --audit-commits "origin/$BASE_REF..HEAD"
      env:
        BASE_REF: ${{ github.base_ref }}

    - name: Lint with Ruff
      run: |
        source .venv/bin/activate
        uv pip install ruff
        ruff check .

    - name: Install browser test runtime
      run: uv run playwright install --with-deps chromium

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest tests/ -m "not sandbox"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    # `tsc` used to run only inside `npm run build`, which only runs in
    # build-desktop - after a release is merged and tagged. A type error could
    # reach a tag before anything noticed. This is the gate that was missing.
    - name: Typecheck
      working-directory: frontend
      run: npm run typecheck

    - name: Run tests
      working-directory: frontend
      run: npm test

    # Advisory while the existing violations are worked through; the report is
    # the point. Flip to a blocking step once `npm run lint` is clean.
    - name: Lint
      working-directory: frontend
      continue-on-error: true
      run: npm run lint

    # Blocking, unlike the linter: the whole tree was formatted in one commit,
    # so this starts clean and only fails on something newly unformatted.
    - name: Check formatting
      working-directory: frontend
      run: npm run format:check

  rust:
    name: Rust
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # A Tauri crate pulls in webkit2gtk and a full Rust compile, which is far
    # too much to spend on every docs or backend PR. Both crates are only built
    # when Rust actually changed.
    - name: Detect Rust changes
      id: changed
      shell: bash
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          git fetch --no-tags origin "$BASE_REF"
          range="origin/$BASE_REF...HEAD"
        elif git rev-parse -q --verify HEAD~1 >/dev/null; then
          range="HEAD~1..HEAD"
        else
          range=""
        fi

        if [[ -z "$range" ]]; then
          touched=true
        elif git diff --name-only "$range" | grep -qE '^(src-tauri|apps)/'; then
          touched=true
        else
          touched=false
        fi

        echo "Rust sources touched: $touched"
        echo "touched=$touched" >> "$GITHUB_OUTPUT"
      env:
        BASE_REF: ${{ github.base_ref }}

    - name: Install Linux system dependencies
      if: steps.changed.outputs.touched == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      if: steps.changed.outputs.touched == 'true'
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: steps.changed.outputs.touched == 'true'
      with:
        workspaces: |
          src-tauri
          apps/suzent-installer

    - name: Test the desktop shell
      if: steps.changed.outputs.touched == 'true'
      working-directory: src-tauri
      run: cargo test

    - name: Test the installer
      if: steps.changed.outputs.touched == 'true'
      working-directory: apps/suzent-installer
      run: cargo test
