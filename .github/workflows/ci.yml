name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Check version consistency
      run: python scripts/bump_version.py --check

    # Advisory only. The release bump is derived from these prefixes, so an
    # unreadable one silently changes the version that ships - but a wording
    # nit must never block a merge.
    - name: Audit commit prefixes
      if: github.event_name == 'pull_request'
      run: |
        git fetch --no-tags --depth=50 origin "$BASE_REF"
        python scripts/bump_version.py --audit-commits "origin/$BASE_REF..HEAD"
      env:
        BASE_REF: ${{ github.base_ref }}

    - name: Lint with Ruff
      run: |
        source .venv/bin/activate
        uv pip install ruff
        ruff check .

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest tests/ -m "not sandbox"
