name: Refresh Release PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# Manual preparation uses the same lock, so it cannot race a refresh.
concurrency:
  group: product-release-plans
  cancel-in-progress: false

jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        product: [desktop, mobile, browser]
    runs-on: ubuntu-22.04
    env:
      PRODUCT: ${{ matrix.product }}
      GH_REPO: ${{ github.repository }}
      ACTIONS_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Refresh product plan
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            desktop) branch=release/next; prefix=v ;;
            mobile) branch=release/mobile; prefix=mobile-v ;;
            browser) branch=release/browser; prefix=browser-v ;;
          esac
          source="$(git rev-parse origin/main)"
          prs="$(gh pr list --base main --head "$branch" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)]')"
          count="$(jq length <<< "$prs")"
          if [[ "$count" -gt 1 ]]; then
            echo '::error::Multiple product release PRs found'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$count" == 1 ]]; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
            # Only generated product files may be resolved automatically.
            if ! git merge --no-edit "$source"; then
              generated="$(python scripts/release_plan.py files --product "$PRODUCT")"
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              [[ "${#conflicts[@]}" -gt 0 ]] || exit 1
              for path in "${conflicts[@]}"; do
                if ! grep -qxF -- "$path" <<< "$generated"; then
                  echo "::error::Resolve $path manually before refreshing"
                  exit 1
                fi
              done
              git checkout "$source" -- "${conflicts[@]}"
              git add -A
              git commit --no-edit
            fi
          else
            git switch -c "$branch" "$source"
          fi
          plan="$(python scripts/release_plan.py apply --product "$PRODUCT" --source "$source")"
          if [[ "$(jq -r .releasable <<< "$plan")" != true ]]; then
            echo "::notice::No $PRODUCT release pending"
            exit 0
          fi
          version="$(jq -r .version <<< "$plan")"
          python scripts/release_plan.py check --base "$source" --release-product "$PRODUCT"
          python scripts/bump_version.py --check
          python scripts/generate_mobile_version.py --check
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare $PRODUCT $prefix$version"
          fi
          if [[ "$count" == 1 ]]; then
            git push origin "HEAD:$branch"
            number="$(jq -r '.[0].number' <<< "$prs")"
            gh pr edit "$number" --title "chore: release $prefix$version"
          else
            # A closed release PR may have left its branch behind. Lease the
            # exact observed SHA instead of overwriting a concurrent update.
            old="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
            git push --force-with-lease="refs/heads/$branch:$old" origin "HEAD:$branch"
            # shellcheck disable=SC2016
            body="$(printf '%s\n' \
              "Release plan for **$PRODUCT $version**." \
              '' \
              'Review the product changelog and release declarations. Version overrides belong in `.releases/overrides/` and survive refreshes.' \
              '' \
              'Desktop: merging tags and starts the existing desktop publication workflow.' \
              'Browser: merging packages and publishes the extension ZIP; store submission remains manual.' \
              'Mobile: merging records the version and notes only; store and GitHub Release distribution are future work.' \
              '' \
              'Merge with a merge commit once checks pass. See docs/03-developing/releasing.md.')"
            gh pr create --base main --head "$branch" --title "chore: release $prefix$version" --body "$body"
          fi
          # Explicit dispatch also works when the built-in token suppresses PR events.
          GH_TOKEN="$ACTIONS_TOKEN" gh workflow run ci.yml --ref "$branch" -f "release_product=$PRODUCT"
          if [[ "$PRODUCT" == mobile ]]; then
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run mobile.yml --ref "$branch"
          fi
