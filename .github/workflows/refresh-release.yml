name: Refresh Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - name: Find open Release PR
        id: pr
        shell: bash
        run: |
          release_prs="$(
            gh pr list \
              --state open \
              --base main \
              --limit 100 \
              --json number,headRefName,isCrossRepository \
              --jq '[.[] | select(
                .isCrossRepository == false and
                (.headRefName | startswith("release/v"))
              )]'
          )"
          count="$(jq length <<< "$release_prs")"

          if [[ "$count" == "0" ]]; then
            echo "::notice::No open Release PR found; nothing to refresh"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != "1" ]]; then
            candidates="$(jq -r '.[] | "#\(.number) \(.headRefName)"' <<< "$release_prs")"
            echo "::error::Expected one open Release PR, found $count: $candidates"
            exit 1
          fi

          head="$(jq -r '.[0].headRefName' <<< "$release_prs")"
          number="$(jq -r '.[0].number' <<< "$release_prs")"
          echo "::notice::Refreshing Release PR #$number from $head"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Checkout release branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Set up Python
        if: steps.pr.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge main and refresh release notes
        if: steps.pr.outputs.found == 'true'
        id: refresh
        shell: bash
        run: |
          git fetch origin main --tags
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "::notice::Release PR is already up to date with main"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          python scripts/bump_version.py --refresh-changelog
          python scripts/bump_version.py --check
          git add CHANGELOG.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh release notes"
          fi
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_BRANCH: ${{ steps.pr.outputs.head }}

      - name: Start CI for refreshed head
        if: >-
          steps.pr.outputs.found == 'true' &&
          steps.refresh.outputs.updated == 'true'
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ steps.pr.outputs.head }}
