name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to prepare
        type: choice
        options: [desktop, mobile, browser]
        default: desktop
        required: true
      version:
        description: 'auto, patch, minor, major, or an exact version'
        type: string
        default: auto
        required: true
      reason:
        description: Reason for an explicit version override
        type: string
      desktop_assets:
        description: Desktop assets (ignored for mobile and browser)
        type: choice
        options: [build, reuse]
        default: build
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: product-release-plans
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      ACTIONS_TOKEN: ${{ github.token }}
      PRODUCT: ${{ inputs.product }}
      RELEASE_INPUT: ${{ inputs.version }}
      OVERRIDE_REASON: ${{ inputs.reason }}
      DESKTOP_ASSETS: ${{ inputs.desktop_assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare reviewed override
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            desktop) branch=release/next; prefix=v ;;
            mobile) branch=release/mobile; prefix=mobile-v ;;
            browser) branch=release/browser; prefix=browser-v ;;
          esac
          if [[ "$(gh pr list --base main --head "$branch" --state open --json number --jq length)" != 0 ]]; then
            echo '::error::Edit the override on the existing release PR instead of replacing it'
            exit 1
          fi
          source="$(git rev-parse HEAD)"
          git switch -c "$branch"
          if [[ "$RELEASE_INPUT" != auto ]]; then
            python scripts/release_plan.py override --product "$PRODUCT" --source "$source" --version "$RELEASE_INPUT" --reason "$OVERRIDE_REASON"
          fi
          plan="$(python scripts/release_plan.py apply --product "$PRODUCT" --source "$source")"
          [[ "$(jq -r .releasable <<< "$plan")" == true ]] || { echo '::error::Nothing to release; request an explicit bump for maintenance'; exit 1; }
          version="$(jq -r .version <<< "$plan")"
          if [[ "$PRODUCT" == desktop ]]; then
            printf '%s\n' "$DESKTOP_ASSETS" > .release-assets-mode
          fi
          python scripts/release_plan.py check --base "$source" --release-product "$PRODUCT"
          python scripts/bump_version.py --check
          python scripts/generate_mobile_version.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare $PRODUCT $prefix$version"
          old="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$old" origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "chore: release $prefix$version" --body 'Review the product changelog and persistent version override. Desktop and browser merges publish through their existing packaging workflows; mobile merges record the version and notes only. See docs/03-developing/releasing.md.'
          GH_TOKEN="$ACTIONS_TOKEN" gh workflow run ci.yml --ref "$branch" -f "release_product=$PRODUCT"
          if [[ "$PRODUCT" == mobile ]]; then
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run mobile.yml --ref "$branch"
          fi
