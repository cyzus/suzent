name: Native mobile
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'packages/SuzentCore/**'
      - 'packages/mobile-contract/**'
      - 'packages/presentation/**'
      - 'scripts/generate_presentation.py'
      - 'frontend/src/presentation.css'
      - 'src/suzent/nodes/**'
      - 'src/suzent/core/stream_registry.py'
      - 'src/suzent/core/stream_replay.py'
      - 'src/suzent/routes/chat_routes.py'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_presentation.py --check
      - run: swift test --package-path packages/SuzentCore
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - run: >-
          xcodebuild -project Suzent.xcodeproj -scheme Suzent
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_presentation.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
        working-directory: apps/android
