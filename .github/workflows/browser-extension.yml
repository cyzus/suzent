name: Release Browser Extension

# Code PRs declare browser impact. Only a merged release/browser plan publishes
# its exact source; manual runs retry that merge commit or its browser-v tag.
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Merged browser release commit or browser-v tag to retry
        type: string
        required: true

concurrency:
  group: browser-extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/browser')
    name: Package and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate the merged release plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || {
              echo '::error::The browser release PR was stale when merged'
              exit 1
            }
            base="$BASE_SHA"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          python scripts/release_plan.py check --base "$base" --release-product browser

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(python scripts/build_browser_extension.py --print-version)"
          tag="browser-v$version"
          source="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [[ "$(git rev-list -n 1 "$tag")" != "$source" ]]; then
            echo "::error::$tag belongs to different source; refusing to replace it"
            exit 1
          fi
          {
            echo "source=$source"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          # Keyed on the asset, not the tag, and not the release either. The tag
          # is pushed before the release exists and the release exists before
          # the ZIP finishes uploading, so either one alone would let a run that
          # failed part-way make every rerun skip and strand the version without
          # a downloadable asset. Only the asset proves the publish finished.
          assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")' 2>/dev/null || true)"
          if [[ " $assets " == *" suzent-browser-$version.zip "* ]]; then
            echo "$tag is already published with its asset; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Build extension ZIP
        if: steps.version.outputs.publish == 'true'
        run: python scripts/build_browser_extension.py --output "dist/suzent-browser-${{ steps.version.outputs.version }}.zip"

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          # A tag left behind by a run that failed before publishing is reused,
          # as long as it names this commit. One naming anything else means the
          # version was already spent on different code.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [[ "$(git rev-list -n 1 "$TAG")" != "$SOURCE_SHA" ]]; then
              echo "::error::$TAG already points at another commit. Bump the extension version."
              exit 1
            fi
            echo "Reusing existing $TAG from an interrupted run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Browser extension $VERSION"
            git push origin "$TAG"
          fi
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          python scripts/release_plan.py notes --product browser > release-notes.md
          cat > store-notes.md <<'NOTES'

          ---

          Suzent Browser extension for Chrome and Edge.

          `suzent-browser-VERSION.zip` is the store upload: the contents of
          `extensions/browser/` with `manifest.json` at the ZIP root. The build is
          reproducible, so this asset can be compared byte-for-byte against a local
          `python scripts/build_browser_extension.py`.

          Submit it to both listings; each queues a human review before the update
          reaches users.

          - Chrome: https://chromewebstore.google.com/detail/suzent-browser/mjfjhclnoepglnjjmheollfpbngjebno
          - Edge: https://microsoftedge.microsoft.com/addons/detail/suzent-browser/hobapppkcjggdhbbpnokgcoiddailnib
          NOTES
          sed "s/VERSION/$VERSION/g" store-notes.md >> release-notes.md
          # --latest=false is load-bearing: gh picks the latest release
          # automatically, and the landing page, both setup scripts, and the
          # installer updater all resolve /releases/latest expecting an app
          # release. A browser release winning that would 404 every download.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Resuming a run that created the release but did not finish the
            # upload. Re-upload rather than recreate, so the release keeps its
            # identity and anything already attached is replaced in place.
            gh release edit "$TAG" \
              --latest=false \
              --title "Browser extension $VERSION" \
              --notes-file release-notes.md
            gh release upload "$TAG" "dist/suzent-browser-$VERSION.zip" --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --latest=false \
              --title "Browser extension $VERSION" \
              --notes-file release-notes.md \
              "dist/suzent-browser-$VERSION.zip"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
