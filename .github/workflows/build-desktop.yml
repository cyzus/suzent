name: Build and Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.7.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      assets_mode: ${{ steps.assets-mode.outputs.mode }}
    steps:
      - name: Resolve and validate release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate version and changelog
        id: changelog
        shell: bash
        run: |
          python scripts/bump_version.py --check
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(python scripts/bump_version.py --print-version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match project version $actual_version"
            exit 1
          fi

          notes="$(awk -v tag="$RELEASE_TAG" '
            index($0, "## [" tag "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no entry for $RELEASE_TAG"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}

      - name: Resolve desktop asset mode
        id: assets-mode
        shell: bash
        run: |
          mode="build"
          if [[ -f .release-assets-mode ]]; then
            mode="$(tr -d '[:space:]' < .release-assets-mode)"
          fi
          if [[ "$mode" != "build" && "$mode" != "reuse" ]]; then
            echo "::error::Invalid desktop asset mode: $mode"
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Create or refresh draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}

  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.assets_mode == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: suzent-windows-x86_64.exe
            binary: src-tauri/target/release/suzent.exe
            installer_asset: suzent-installer-windows-x86_64.exe
            installer_binary: apps/suzent-installer/target/release/suzent-installer.exe
          - os: macos-latest
            asset: suzent-macos-aarch64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-macos-aarch64
            installer_binary: apps/suzent-installer/target/release/suzent-installer
          - os: macos-15-intel
            asset: suzent-macos-x86_64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-macos-x86_64
            installer_binary: apps/suzent-installer/target/release/suzent-installer
          - os: ubuntu-22.04
            asset: suzent-linux-x86_64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-linux-x86_64
            installer_binary: apps/suzent-installer/target/release/suzent-installer

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workdir: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri dependencies
        working-directory: src-tauri
        run: npm ci

      - name: Install installer dependencies
        working-directory: apps/suzent-installer
        run: npm ci

      - name: Build main app
        working-directory: src-tauri
        run: npm run build:dist

      - name: Build installer app
        working-directory: apps/suzent-installer
        run: npm run build

      - name: Upload binaries to draft release
        shell: bash
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          cp "${{ matrix.installer_binary }}" "${{ matrix.installer_asset }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.asset }}" \
            "${{ matrix.installer_asset }}" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}

  reuse-assets:
    needs: prepare-release
    if: needs.prepare-release.outputs.assets_mode == 'reuse'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Copy desktop assets from previous published release
        shell: bash
        run: |
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq \
            '.[].tagName' | grep -Fvx "$RELEASE_TAG" | head -n 1)"
          if [[ -z "$previous_tag" ]]; then
            echo "::error::No previous published release is available for asset reuse"
            exit 1
          fi
          backend_api="$(sed -nE 's/^API_VERSION = ([0-9]+)$/\1/p' src/suzent/routes/system_routes.py)"
          desktop_api="$(git show "$previous_tag:frontend/vite.config.ts" | sed -nE \
            's/.*__SUZENT_API_VERSION__: JSON.stringify\(([0-9]+)\).*/\1/p')"
          if [[ -z "$backend_api" || -z "$desktop_api" || "$backend_api" != "$desktop_api" ]]; then
            echo "::error::Desktop asset reuse is unsafe: backend API $backend_api, previous desktop API $desktop_api"
            exit 1
          fi
          mkdir -p reused-assets
          gh release download "$previous_tag" --pattern 'suzent-*' --dir reused-assets
          if [[ "$(find reused-assets -maxdepth 1 -type f | wc -l)" -lt 8 ]]; then
            echo "::error::Previous release $previous_tag does not contain all desktop and installer assets"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" reused-assets/* --clobber
          echo "Reused desktop assets from $previous_tag"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}

  publish-release:
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.reuse-assets.result == 'success' || needs.reuse-assets.result == 'skipped')
    needs:
      - prepare-release
      - build
      - reuse-assets
    runs-on: ubuntu-22.04
    steps:
      - name: Generate release checksums
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --pattern 'suzent-*' --dir release-assets
          (cd release-assets && sha256sum suzent-* > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}

      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
