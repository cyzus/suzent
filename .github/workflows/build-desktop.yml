name: Build and Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.7.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Resolve and validate release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate version and changelog
        id: changelog
        shell: bash
        run: |
          python scripts/bump_version.py --check
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(python scripts/bump_version.py --print-version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match project version $actual_version"
            exit 1
          fi

          notes="$(awk -v tag="$RELEASE_TAG" '
            index($0, "## [" tag "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no entry for $RELEASE_TAG"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}

      - name: Create or refresh draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: suzent-windows-x86_64.exe
            binary: src-tauri/target/release/suzent.exe
            installer_asset: suzent-installer-windows-x86_64.exe
            installer_binary: apps/suzent-installer/target/release/suzent-installer.exe
          - os: macos-latest
            asset: suzent-macos-aarch64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-macos-aarch64
            installer_binary: apps/suzent-installer/target/release/suzent-installer
          - os: macos-15-intel
            asset: suzent-macos-x86_64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-macos-x86_64
            installer_binary: apps/suzent-installer/target/release/suzent-installer
          - os: ubuntu-22.04
            asset: suzent-linux-x86_64
            binary: src-tauri/target/release/suzent
            installer_asset: suzent-installer-linux-x86_64
            installer_binary: apps/suzent-installer/target/release/suzent-installer

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workdir: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Tauri dependencies
        working-directory: src-tauri
        run: npm ci

      - name: Install installer dependencies
        working-directory: apps/suzent-installer
        run: npm ci

      - name: Build main app
        working-directory: src-tauri
        run: npm run build:dist

      - name: Build installer app
        working-directory: apps/suzent-installer
        run: npm run build

      - name: Upload binaries to draft release
        shell: bash
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          cp "${{ matrix.installer_binary }}" "${{ matrix.installer_asset }}"
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.asset }}" \
            "${{ matrix.installer_asset }}" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}

  publish-release:
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
