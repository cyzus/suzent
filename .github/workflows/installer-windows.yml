name: Installer Windows

on:
  pull_request:
    paths:
      - 'apps/suzent-installer/**'
      - '.github/workflows/installer-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/suzent-installer
          cache-on-failure: true
      - name: Test recovery and hidden subprocesses
        working-directory: apps/suzent-installer
        run: cargo test --locked
      - name: Build test installer
        working-directory: apps/suzent-installer
        run: cargo build --release --locked
      - name: Package test installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-artifact | Out-Null
          Copy-Item apps/suzent-installer/target/release/suzent-installer.exe installer-artifact/suzent-installer-windows-x86_64.exe
          $digest = (Get-FileHash installer-artifact/suzent-installer-windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  suzent-installer-windows-x86_64.exe" | Set-Content installer-artifact/SHA256SUMS -Encoding ascii
          "Source commit: $env:GITHUB_SHA`nTesting build; not a published release." | Set-Content installer-artifact/BUILD.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: suzent-installer-windows-test
          path: installer-artifact/
          if-no-files-found: error
          retention-days: 14
