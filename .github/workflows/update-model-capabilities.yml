name: Update Model Capabilities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Sync tracked model capabilities
        env:
          SUZENT_DATA_DIR: ${{ runner.temp }}/suzent-data
        run: uv run python scripts/sync_model_capabilities.py --to-repo

      - name: Select provider default models
        run: uv run python scripts/sync_model_defaults.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: automation/model-capabilities
          delete-branch: true
          commit-message: "chore: update model capabilities"
          title: "chore: update model capabilities"
          body: |
            Automated refresh of model capability metadata from LiteLLM.

            This keeps high-churn model metadata out of `main` until the
            generated diff is reviewed and merged.
          add-paths: |
            config/capabilities/*.json
            config/provider_defaults.json
