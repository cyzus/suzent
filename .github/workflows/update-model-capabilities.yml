name: Update Model Capabilities

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Sync tracked model capabilities
        env:
          SUZENT_DATA_DIR: ${{ runner.temp }}/suzent-data
        run: uv run python scripts/sync_model_capabilities.py --to-repo

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/model-capabilities
          delete-branch: true
          commit-message: "chore: update model capabilities"
          title: "chore: update model capabilities"
          body: |
            Automated refresh of model capability metadata from LiteLLM.

            This keeps high-churn model metadata out of `main` until the
            generated diff is reviewed and merged.
          add-paths: |
            config/capabilities/*.json
