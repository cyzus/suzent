name: Preview inline code (temporary)
on:
  push:
    branches: [claude/project-thread-h62uy1]
    paths: ['.github/workflows/preview-inline-code.yml', 'apps/android/app/src/androidTest/**']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/generate_mobile_version.py --build-number 1
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: apps/android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.suzent.mobile.InlineCodePreviewTest
            adb pull /sdcard/Android/data/com.suzent.mobile.dev/files/preview ../../preview-out
      - name: Commit screenshots
        run: |
          mkdir -p .preview && cp preview-out/*.png .preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .preview && git commit -m "preview: inline code screenshots" && git push
