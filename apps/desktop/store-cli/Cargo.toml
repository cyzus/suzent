[package]
name = "suzent-store-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "The `suzent` command and start-at-login helper inside the Microsoft Store package"

[[bin]]
name = "suzent"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
