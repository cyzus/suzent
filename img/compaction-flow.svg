<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="The usual way: when the window fills, the agent stops, re-reads the whole history at full price and you wait. Suzent: the summary is written from the cache in the background earlier, and swapped in instantly when compaction is due."><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
  </style>
<rect x="0" y="0" width="880" height="300" rx="14" fill="#fafafa"/>
<text x="32" y="44" class="mono label" font-size="9.5" font-weight="600">USUAL</text><text x="32" y="174" class="mono label" font-size="9.5" font-weight="600">SUZENT</text>
<rect x="110" y="60" width="56" height="30" rx="6" class="card"/>
<rect x="174" y="60" width="56" height="30" rx="6" class="card"/>
<rect x="238" y="60" width="56" height="30" rx="6" class="card"/>
<rect x="302" y="60" width="56" height="30" rx="6" class="card"/>
<rect x="366" y="60" width="56" height="30" rx="6" class="card"/>
<text x="270" y="112" class="mono" font-size="9" fill="#8a8a8a" text-anchor="middle">your messages</text>
<rect x="434" y="56" width="260" height="38" rx="8" fill="#d4d4d4"/><text x="564" y="79.5" class="ui" font-size="12" fill="#1a1a1a" text-anchor="middle">re-read everything at full price</text>
<text x="564" y="112" class="mono" font-size="9" fill="#1a1a1a" text-anchor="middle">YOU WAIT</text>
<rect x="702" y="60" width="56" height="30" rx="6" class="card"/>
<line x1="430" y1="40" x2="430" y2="120" stroke="#1a1a1a" stroke-dasharray="3 3"/><text x="430" y="34" class="mono" font-size="9" fill="#1a1a1a" text-anchor="middle">window full</text>
<rect x="110" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="174" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="238" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="302" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="366" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="438" y="190" width="56" height="30" rx="6" class="card"/>
<rect x="238" y="238" width="190" height="26" rx="6" fill="#1a1a1a"/><text x="333" y="255" class="ui" font-size="11" fill="#ffffff" text-anchor="middle">summary from the cache</text>
<text x="333" y="282" class="mono" font-size="9" fill="#8a8a8a" text-anchor="middle">in the background, at 350k</text>
<path d="M 428 251 L 430 251 L 430 224" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="430" y1="170" x2="430" y2="234" stroke="#1a1a1a" stroke-dasharray="3 3"/><text x="430" y="164" class="mono" font-size="9" fill="#1a1a1a" text-anchor="middle">500k · swapped in</text>
<rect x="502" y="190" width="56" height="30" rx="6" class="card"/><rect x="566" y="190" width="56" height="30" rx="6" class="card"/><rect x="630" y="190" width="56" height="30" rx="6" class="card"/>
<text x="740" y="210" class="mono" font-size="9" fill="#1a1a1a">NO WAIT</text>
</svg>
