[package]
name = "suzent"
version = "0.23.0"
edition = "2021"
description = "SUZENT - Your Personal Agent"
authors = ["SUZENT Team"]


[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "~2.3"
notify-rust = "4.18"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
uuid = { version = "1", features = ["v4"] }

# WinRT StartupTask for "start at login" in the MSIX package (packaged.rs).
# 0.61 is already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["ApplicationModel", "Foundation"] }

[dev-dependencies]
tempfile = "3"

