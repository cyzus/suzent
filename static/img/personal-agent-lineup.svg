<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="The 2026 big-tech personal agent lineup across Anthropic, Apple, Microsoft, Meta, OpenAI, and Google, and their shared cloud-integration premise.">
  <defs>
    <pattern id="lineup-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
    <pattern id="lineup-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d8d8d8" stroke-width="2"/>
    </pattern>
  </defs>

  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
    .shadow { fill: #000000; }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <rect x="12" y="12" width="856" height="476" fill="url(#lineup-grid)" stroke="#000000" stroke-width="3"/>

  <!-- Top Header Bar -->
  <rect x="12" y="12" width="856" height="42" fill="#000000"/>
  <rect x="28" y="22" width="32" height="22" fill="#ffffff"/>
  <text x="44" y="37" class="mono" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">01</text>
  <text x="72" y="38" class="mono" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">THE 2026 PERSONAL-AGENT LINEUP · SIX VENDORS, ONE PITCH</text>
  <text x="850" y="37" class="mono" font-size="10" fill="#bbbbbb" text-anchor="end">FEB – SEP 2026</text>

  <!-- ===================================================================== -->
  <!-- ROW 1: ANTHROPIC · APPLE · MICROSOFT                                  -->
  <!-- ===================================================================== -->

  <!-- Card 1: Anthropic -->
  <g transform="translate(32, 72)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">ANTHROPIC</text>
    <rect x="182" y="6" width="66" height="18" fill="#000000"/>
    <text x="215" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">FEB 2026</text>

    <!-- Terminal glyph -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="34" height="34" fill="#000000"/>
      <path d="M 8 11 L 16 17 L 8 23" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="square"/>
      <line x1="18" y1="23" x2="26" y2="23" stroke="#ffffff" stroke-width="2.2"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">Claude Cowork</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">CLOUD · WORKFLOW AUTOMATION</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">Automates multi-step business ops.</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">Launch erased ~$285B from SaaS,</text>
    <rect x="14" y="135" width="230" height="18" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#000000">IT &amp; legal equities in a single week</text>
  </g>

  <!-- Card 2: Apple -->
  <g transform="translate(311, 72)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">APPLE</text>
    <rect x="182" y="6" width="66" height="18" fill="#000000"/>
    <text x="215" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">2026</text>

    <!-- Silicon chip glyph -->
    <g transform="translate(14, 44)">
      <rect x="4" y="4" width="26" height="26" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <rect x="10" y="10" width="14" height="14" fill="#000000"/>
      <line x1="11" y1="0" x2="11" y2="4" stroke="#000000" stroke-width="2"/>
      <line x1="23" y1="0" x2="23" y2="4" stroke="#000000" stroke-width="2"/>
      <line x1="11" y1="30" x2="11" y2="34" stroke="#000000" stroke-width="2"/>
      <line x1="23" y1="30" x2="23" y2="34" stroke="#000000" stroke-width="2"/>
      <line x1="0" y1="11" x2="4" y2="11" stroke="#000000" stroke-width="2"/>
      <line x1="0" y1="23" x2="4" y2="23" stroke="#000000" stroke-width="2"/>
      <line x1="30" y1="11" x2="34" y2="11" stroke="#000000" stroke-width="2"/>
      <line x1="30" y1="23" x2="34" y2="23" stroke="#000000" stroke-width="2"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">Siri Intelligence</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">ON-DEVICE-FIRST · PRIVATE CLOUD</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">Upgraded Siri across screen &amp; apps.</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">Local inference where possible, but</text>
    <rect x="14" y="135" width="230" height="18" fill="url(#lineup-hatch)" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#000000">bound to Apple hardware &amp; iCloud</text>
  </g>

  <!-- Card 3: Microsoft -->
  <g transform="translate(590, 72)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">MICROSOFT</text>
    <rect x="182" y="6" width="66" height="18" fill="#000000"/>
    <text x="215" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">2026</text>

    <!-- 4-square grid glyph -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="15" height="15" fill="#000000"/>
      <rect x="19" y="0" width="15" height="15" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
      <rect x="0" y="19" width="15" height="15" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
      <rect x="19" y="19" width="15" height="15" fill="url(#lineup-hatch)" stroke="#000000" stroke-width="2.2"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">Microsoft Copilot</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">CLOUD · THREE-HORIZON AI</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">Rebuilt around a Three-Horizon</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">AI Architecture across Windows,</text>
    <rect x="14" y="135" width="230" height="18" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#000000">Office 365 &amp; enterprise tenant graph</text>
  </g>

  <!-- ===================================================================== -->
  <!-- ROW 2: META · OPENAI · GOOGLE                                         -->
  <!-- ===================================================================== -->

  <!-- Card 4: Meta -->
  <g transform="translate(32, 254)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">META</text>
    <rect x="164" y="6" width="84" height="18" fill="#000000"/>
    <text x="206" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SEP 8, 2026</text>

    <!-- Twin loops glyph -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="34" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
      <circle cx="13" cy="17" r="7.5" fill="none" stroke="#000000" stroke-width="2.5"/>
      <circle cx="21" cy="17" r="7.5" fill="none" stroke="#000000" stroke-width="2.5"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">Meta Muse</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">CLOUD · CONSUMER &amp; SMB</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">Performs tasks on the user's behalf.</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">Hit #1 most-downloaded app; expanded</text>
    <rect x="14" y="135" width="230" height="18" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#000000">to small-business agents 3 wks later</text>
  </g>

  <!-- Card 5: OpenAI -->
  <g transform="translate(311, 254)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">OPENAI</text>
    <rect x="158" y="6" width="90" height="18" fill="#000000"/>
    <text x="203" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SEP 29 · DEVDAY</text>

    <!-- Dots glyph -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="34" height="34" fill="#000000"/>
      <circle cx="11" cy="11" r="3.8" fill="#ffffff"/>
      <circle cx="23" cy="11" r="3.8" fill="#ffffff"/>
      <circle cx="11" cy="23" r="3.8" fill="#ffffff"/>
      <circle cx="23" cy="23" r="3.8" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">OpenAI Dots</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">CLOUD · GPT-6 ASTRA</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">Always-on personal agents with</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">avatars working in the background</text>
    <rect x="14" y="135" width="230" height="18" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#000000">across ChatGPT, Slack &amp; Teams</text>
  </g>

  <!-- Card 6: Google -->
  <g transform="translate(590, 254)">
    <rect x="5" y="5" width="258" height="162" class="shadow"/>
    <rect x="0" y="0" width="258" height="162" class="card"/>
    <rect x="0" y="0" width="258" height="30" fill="#f4f4f4" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="20" class="mono" font-size="10" font-weight="700" fill="#000000" letter-spacing="0.6">GOOGLE</text>
    <rect x="172" y="6" width="76" height="18" fill="#000000"/>
    <text x="210" y="18" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">I/O 2026</text>

    <!-- Spark glyph -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="34" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
      <polygon points="17,4 20.5,13.5 30,17 20.5,20.5 17,30 13.5,20.5 4,17 13.5,13.5" fill="#000000"/>
    </g>
    <text x="58" y="59" class="ui" font-size="16" font-weight="800" fill="#000000">Gemini Spark</text>
    <text x="58" y="75" class="mono" font-size="9.5" font-weight="700" fill="#555555">3.5 FLASH · ANTIGRAVITY</text>

    <line x1="14" y1="90" x2="244" y2="90" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="14" y="108" class="ui" font-size="11.5" fill="#111111">24/7 inbox watcher, file organizer,</text>
    <text x="14" y="125" class="ui" font-size="11.5" fill="#111111">PDF-to-Sheets extractor, built to</text>
    <rect x="14" y="135" width="230" height="18" fill="#000000"/>
    <text x="20" y="147" class="mono" font-size="9" font-weight="700" fill="#ffffff">"eventually spend your money"</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM SUMMARY BAR                                                    -->
  <!-- ===================================================================== -->
  <g transform="translate(32, 434)">
    <rect x="4" y="4" width="816" height="36" class="shadow"/>
    <rect x="0" y="0" width="816" height="36" fill="#000000"/>
    <text x="408" y="23" class="ui" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Shared architecture: always-on, running on a computer you do not control, and more "useful" the more of your life you feed in.</text>
  </g>
</svg>
