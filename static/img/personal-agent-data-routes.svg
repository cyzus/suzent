<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="Comparison of data flows: the Integration Route funnels your life into one vendor's cloud graph and rents access back to you; the Sovereign Route keeps your data, memory, and permissions on your machine.">
  <defs>
    <marker id="dr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .title { fill: #111111; font-weight: 650; }
    .body { fill: #4d4d4d; }
    .wire { fill: none; stroke: #8f8f8f; stroke-width: 1.25; }
    .tag { fill: #f2f2f2; }
  </style>

  <rect x="0" y="0" width="880" height="460" rx="14" fill="#fafafa"/>
  <line x1="440" y1="28" x2="440" y2="432" stroke="#e6e6e6"/>

  <!-- ============ LEFT: integration route ============ -->
  <text x="36" y="42" class="mono label" font-size="9.5" font-weight="600">01 · THE INTEGRATION ROUTE</text>
  <text x="36" y="64" class="ui title" font-size="16">Their graph</text>

  <g class="ui" font-size="11" fill="#4d4d4d" text-anchor="middle">
    <rect x="44" y="84" width="84" height="28" rx="7" class="card"/>
    <text x="86" y="102">Inbox</text>
    <rect x="136" y="84" width="84" height="28" rx="7" class="card"/>
    <text x="178" y="102">Calendar</text>
    <rect x="228" y="84" width="84" height="28" rx="7" class="card"/>
    <text x="270" y="102">Files / Docs</text>
    <rect x="320" y="84" width="84" height="28" rx="7" class="card"/>
    <text x="362" y="102">Habits / Chat</text>
  </g>
  <path d="M 86 112 L 180 146" class="wire" marker-end="url(#dr-arrow)"/>
  <path d="M 178 112 L 210 146" class="wire" marker-end="url(#dr-arrow)"/>
  <path d="M 270 112 L 240 146" class="wire" marker-end="url(#dr-arrow)"/>
  <path d="M 362 112 L 270 146" class="wire" marker-end="url(#dr-arrow)"/>

  <g transform="translate(58, 152)">
    <rect width="332" height="112" rx="10" fill="#f0f0f0"/>
    <text x="16" y="24" class="mono label" font-size="9" font-weight="600">VENDOR CLOUD SANDBOX</text>
    <rect x="248" y="12" width="70" height="17" rx="8.5" fill="#ffffff"/>
    <text x="283" y="23.5" class="mono" font-size="8" fill="#666666" text-anchor="middle">opaque DB</text>
    <text x="166" y="54" class="ui title" font-size="15" text-anchor="middle">Proprietary context graph</text>
    <text x="166" y="72" class="ui body" font-size="11" text-anchor="middle">Model, memory and permissions, fused</text>
    <text x="166" y="96" class="mono" font-size="9.5" fill="#777777" text-anchor="middle">can’t read · can’t diff · can’t leave</text>
  </g>

  <line x1="224" y1="264" x2="224" y2="320" class="wire" marker-end="url(#dr-arrow)"/>
  <text x="236" y="296" class="mono" font-size="9" fill="#8a8a8a">rented back to you</text>

  <g transform="translate(124, 326)">
    <rect width="200" height="54" rx="10" class="card"/>
    <text x="100" y="24" class="ui title" font-size="13.5" text-anchor="middle">You, the tenant</text>
    <text x="100" y="41" class="ui body" font-size="10.5" text-anchor="middle">Leave = start from zero</text>
  </g>

  <text x="224" y="420" class="ui" font-size="12.5" fill="#555555" text-anchor="middle">Every month makes leaving costlier.</text>

  <!-- vs -->
  <circle cx="440" cy="222" r="15" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="440" y="225.5" class="mono" font-size="9.5" fill="#8a8a8a" text-anchor="middle">vs</text>

  <!-- ============ RIGHT: sovereign route ============ -->
  <text x="468" y="42" class="mono label" font-size="9.5" font-weight="600">02 · THE SOVEREIGN ROUTE</text>
  <text x="468" y="64" class="ui title" font-size="16">Your boundary</text>

  <rect x="468" y="80" width="380" height="262" rx="12" fill="none" stroke="#bdbdbd" stroke-dasharray="4 4"/>
  <rect x="482" y="73" width="92" height="14" fill="#fafafa"/>
  <text x="488" y="83.5" class="mono label" font-size="8.5">YOUR MACHINE</text>

  <g transform="translate(502, 100)">
    <rect width="312" height="52" rx="10" class="card"/>
    <text x="156" y="23" class="ui title" font-size="13.5" text-anchor="middle">You + your raw data</text>
    <text x="156" y="40" class="mono" font-size="9" fill="#8a8a8a" text-anchor="middle">files · notes · code</text>
  </g>

  <line x1="624" y1="152" x2="624" y2="192" class="wire" marker-end="url(#dr-arrow)"/>
  <text x="614" y="176" class="mono" font-size="9" fill="#8a8a8a" text-anchor="end">reads / writes</text>
  <line x1="692" y1="196" x2="692" y2="156" class="wire" marker-end="url(#dr-arrow)"/>
  <text x="702" y="176" class="mono" font-size="9" fill="#8a8a8a">auditable</text>

  <g transform="translate(486, 198)">
    <rect width="344" height="128" rx="10" class="card-em"/>
    <text x="16" y="24" class="mono" font-size="9" font-weight="600" fill="#333333" letter-spacing="0.08em">SUZENT · AGENT STATE</text>
    <rect x="258" y="12" width="70" height="17" rx="8.5" class="tag"/>
    <text x="293" y="23.5" class="mono" font-size="8" fill="#666666" text-anchor="middle">plain files</text>
    <g text-anchor="middle">
      <rect x="16" y="40" width="98" height="72" rx="7" class="tag"/>
      <text x="65" y="62" class="mono" font-size="10.5" font-weight="700" fill="#111111">memory/</text>
      <text x="65" y="88" class="ui body" font-size="10.5">Markdown + git</text>
      <rect x="123" y="40" width="98" height="72" rx="7" class="tag"/>
      <text x="172" y="62" class="mono" font-size="10.5" font-weight="700" fill="#111111">skills/</text>
      <text x="172" y="88" class="ui body" font-size="10.5">Portable workflows</text>
      <rect x="230" y="40" width="98" height="72" rx="7" class="tag"/>
      <text x="279" y="62" class="mono" font-size="10.5" font-weight="700" fill="#111111">policy</text>
      <text x="279" y="88" class="ui body" font-size="10.5">Approval gates</text>
    </g>
  </g>

  <line x1="658" y1="342" x2="658" y2="364" class="wire" stroke-dasharray="3 3" marker-end="url(#dr-arrow)"/>
  <text x="668" y="357" class="mono" font-size="9" fill="#8a8a8a">stateless call</text>

  <g transform="translate(502, 368)">
    <rect width="312" height="40" rx="8" fill="#f0f0f0"/>
    <text x="156" y="17" class="ui" font-size="11.5" font-weight="600" fill="#333333" text-anchor="middle">Any model engine</text>
    <text x="156" y="31" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="middle">Claude · GPT · Gemini · DeepSeek · Local</text>
  </g>

  <text x="658" y="432" class="ui" font-size="12.5" font-weight="650" fill="#111111" text-anchor="middle">Rent the engine. Keep the vehicle.</text>
</svg>
