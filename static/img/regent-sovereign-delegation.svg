<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="The Sovereign and the Regent: you hold the crown and set direction, delegating day-to-day governance of project ministers to Regent, who returns only for royal assent.">
  <defs>
    <pattern id="sov-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
    <pattern id="sov-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dcdcdc" stroke-width="2"/>
    </pattern>
    <marker id="sov-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>

    <!-- Exact 2D RegentMark from frontend/src/components/regent/RegentMark.tsx (24 x 33.6) -->
    <g id="regent-mark-2d">
      <path d="M3 3.6 Q12 0 21 3.6 L21 6.6 Q12 10.2 3 6.6 Z" fill="#000000"/>
      <path d="M4.6 4.2 Q12 6.9 19.4 4.2" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.65"/>
      <rect x="10.3" y="5.3" width="3.4" height="3.4" rx="0.8" transform="rotate(45 12 7)" fill="#ffffff"/>
      <rect x="0" y="9.6" width="24" height="24" rx="4" fill="#000000"/>
      <rect x="5" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
      <rect x="14" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
    </g>

    <!-- Plain Suzent 2D Robot Head (24 x 24) for Project Ministers -->
    <g id="suzent-head-2d">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#000000"/>
      <rect x="5" y="8" width="5" height="5" rx="1.5" fill="#ffffff"/>
      <rect x="14" y="8" width="5" height="5" rx="1.5" fill="#ffffff"/>
    </g>
  </defs>

  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #000000; stroke-width: 3; }
    .shadow { fill: #000000; }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="390" fill="#ffffff"/>
  <rect x="12" y="12" width="856" height="366" fill="url(#sov-grid)" stroke="#000000" stroke-width="3"/>

  <!-- Top Banner -->
  <rect x="12" y="12" width="856" height="36" fill="#000000"/>
  <text x="32" y="34" class="mono" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">THE CONSTITUTIONAL MODEL · SOVEREIGN VS. REGENT</text>
  <text x="848" y="34" class="mono" font-size="10" fill="#bbbbbb" text-anchor="end">RULE BY DELEGATION, NOT MICROMANAGEMENT</text>

  <!-- ===================================================================== -->
  <!-- LEFT: THE SOVEREIGN (YOU / THE MONARCH)                               -->
  <!-- ===================================================================== -->
  <g transform="translate(36, 74)">
    <rect x="7" y="7" width="224" height="272" class="shadow"/>
    <rect x="0" y="0" width="224" height="272" class="card"/>

    <!-- Header -->
    <rect x="0" y="0" width="224" height="32" fill="#f0f0f0" stroke="#000000" stroke-width="3"/>
    <text x="112" y="21" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.8">THE SOVEREIGN (YOU)</text>

    <!-- Monarch Crown Emblem -->
    <g transform="translate(68, 50)">
      <rect x="4" y="4" width="88" height="88" fill="url(#sov-hatch)" stroke="#000000" stroke-width="2"/>
      <rect x="0" y="0" width="88" height="88" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
      <!-- Geometric Royal Crown -->
      <path d="M 16 62 L 20 30 L 34 44 L 44 22 L 54 44 L 68 30 L 72 62 Z" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="miter"/>
      <rect x="16" y="66" width="56" height="6" fill="#000000"/>
      <!-- Crown Jewels -->
      <circle cx="20" cy="25" r="2.5" fill="#000000"/>
      <circle cx="44" cy="17" r="3" fill="#000000"/>
      <circle cx="68" cy="25" r="2.5" fill="#000000"/>
      <rect x="41.5" y="45" width="5" height="5" transform="rotate(45 44 47.5)" fill="#ffffff"/>
    </g>

    <text x="112" y="164" class="ui" font-size="15" font-weight="900" fill="#000000" text-anchor="middle">Sets the Direction</text>
    <text x="112" y="182" class="mono" font-size="10" fill="#555555" text-anchor="middle">Holds ultimate authority</text>

    <line x1="20" y1="196" x2="204" y2="196" stroke="#000000" stroke-width="1.5"/>

    <text x="20" y="216" class="mono" font-size="9" font-weight="700" fill="#000000">✓ Issues high-level edicts</text>
    <text x="20" y="234" class="mono" font-size="9" font-weight="700" fill="#000000">✓ Grants final royal assent</text>
    <text x="20" y="252" class="mono" font-size="9" fill="#666666">✗ Never drafts the decrees</text>
  </g>

  <!-- ===================================================================== -->
  <!-- CENTER: THE MANDATE & ESCALATION CHANNELS                             -->
  <!-- ===================================================================== -->
  <!-- Top Channel: Delegate Authority -->
  <g transform="translate(274, 118)">
    <rect x="0" y="0" width="224" height="54" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="0" y="0" width="224" height="18" fill="#000000"/>
    <text x="112" y="13" class="mono" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">1. DELEGATE GOVERNANCE →</text>
    <text x="112" y="34" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">"Ship v0.18 &amp; audit the API"</text>
    <text x="112" y="47" class="mono" font-size="8" fill="#555555" text-anchor="middle">One command · Regent handles the rest</text>
  </g>
  <line x1="268" y1="184" x2="504" y2="184" stroke="#000000" stroke-width="3" marker-end="url(#sov-arrow)"/>

  <!-- Bottom Channel: Matters of State Only -->
  <line x1="508" y1="226" x2="272" y2="226" stroke="#000000" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sov-arrow)"/>
  <g transform="translate(274, 238)">
    <rect x="0" y="0" width="224" height="54" fill="#f7f7f7" stroke="#000000" stroke-width="2.5"/>
    <rect x="0" y="0" width="224" height="18" fill="#e5e5e5" stroke="#000000" stroke-width="2"/>
    <text x="112" y="13" class="mono" font-size="9" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.6">← 2. ROYAL ASSENT ONLY</text>
    <text x="112" y="34" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">Only sovereign choices return</text>
    <text x="112" y="47" class="mono" font-size="8" fill="#555555" text-anchor="middle">Routine administration stays silent</text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT: THE REGENT & PROJECT MINISTERS                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(516, 74)">
    <rect x="7" y="7" width="324" height="272" class="shadow"/>
    <rect x="0" y="0" width="324" height="272" class="card"/>

    <!-- Header -->
    <rect x="0" y="0" width="324" height="32" fill="#000000"/>
    <text x="162" y="21" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">THE REGENT · GOVERNS IN YOUR STEAD</text>

    <!-- Regent Seat (with exact 2D RegentMark) -->
    <g transform="translate(20, 46)">
      <rect x="4" y="4" width="284" height="86" fill="url(#sov-hatch)" stroke="#000000" stroke-width="2"/>
      <rect x="0" y="0" width="284" height="86" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>

      <!-- Scaled Exact 2D RegentMark (24x33.6 -> scaled 1.85x) -->
      <g transform="translate(18, 12) scale(1.85)">
        <use href="#regent-mark-2d"/>
      </g>

      <text x="78" y="30" class="ui" font-size="16" font-weight="900" fill="#000000" letter-spacing="0.5">REGENT</text>
      <rect x="152" y="17" width="116" height="17" fill="#000000"/>
      <text x="210" y="29" class="mono" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">WEARS THE CIRCLET</text>
      <text x="78" y="49" class="mono" font-size="10" font-weight="700" fill="#222222">Commands the project ministers</text>
      <text x="78" y="65" class="mono" font-size="9" fill="#555555">Dispatches decrees · filters petitions</text>
    </g>

    <!-- Dispatch lines to Ministers -->
    <line x1="162" y1="136" x2="162" y2="156" stroke="#000000" stroke-width="2.5"/>
    <line x1="62" y1="156" x2="262" y2="156" stroke="#000000" stroke-width="2.5"/>
    <line x1="62" y1="156" x2="62" y2="174" stroke="#000000" stroke-width="2.5" marker-end="url(#sov-arrow)"/>
    <line x1="162" y1="156" x2="162" y2="174" stroke="#000000" stroke-width="2.5" marker-end="url(#sov-arrow)"/>
    <line x1="262" y1="156" x2="262" y2="174" stroke="#000000" stroke-width="2.5" marker-end="url(#sov-arrow)"/>

    <!-- 3 Project Ministers (Plain Suzent 2D Heads) -->
    <g transform="translate(18, 178)">
      <rect x="3" y="3" width="88" height="76" class="shadow"/>
      <rect x="0" y="0" width="88" height="76" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g transform="translate(32, 10)">
        <use href="#suzent-head-2d"/>
      </g>
      <text x="44" y="50" class="ui" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">Research</text>
      <text x="44" y="64" class="mono" font-size="8" fill="#555555" text-anchor="middle">Project Session</text>
    </g>

    <g transform="translate(118, 178)">
      <rect x="3" y="3" width="88" height="76" class="shadow"/>
      <rect x="0" y="0" width="88" height="76" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g transform="translate(32, 10)">
        <use href="#suzent-head-2d"/>
      </g>
      <text x="44" y="50" class="ui" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">Coding</text>
      <text x="44" y="64" class="mono" font-size="8" fill="#555555" text-anchor="middle">Project Session</text>
    </g>

    <g transform="translate(218, 178)">
      <rect x="3" y="3" width="88" height="76" class="shadow"/>
      <rect x="0" y="0" width="88" height="76" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g transform="translate(32, 10)">
        <use href="#suzent-head-2d"/>
      </g>
      <text x="44" y="50" class="ui" font-size="10" font-weight="800" fill="#000000" text-anchor="middle">Writing</text>
      <text x="44" y="64" class="mono" font-size="8" fill="#555555" text-anchor="middle">Project Session</text>
    </g>
  </g>
</svg>
