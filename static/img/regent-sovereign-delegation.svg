<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="The Sovereign and the Regent: you hold the crown and set direction, delegating day-to-day governance of project ministers to Regent, who returns only for royal assent.">
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="sd-mark">
      <path d="M3 3.6 Q12 0 21 3.6 L21 6.6 Q12 10.2 3 6.6 Z" fill="#1a1a1a"/>
      <rect x="10.3" y="5.3" width="3.4" height="3.4" rx="0.8" transform="rotate(45 12 7)" fill="#ffffff"/>
      <rect x="0" y="9.6" width="24" height="24" rx="5" fill="#1a1a1a"/>
      <rect x="5" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
      <rect x="14" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
    </g>
    <g id="sd-face">
      <rect x="0" y="0" width="22" height="20" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.25"/>
      <rect x="5" y="7.5" width="4" height="4" rx="1.2" fill="#1a1a1a"/>
      <rect x="13" y="7.5" width="4" height="4" rx="1.2" fill="#1a1a1a"/>
    </g>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .title { fill: #111111; font-weight: 650; }
    .body { fill: #4d4d4d; }
    .wire { fill: none; stroke: #8f8f8f; stroke-width: 1.25; }
  </style>

  <rect x="0" y="0" width="880" height="390" rx="14" fill="#fafafa"/>

  <text x="36" y="40" class="mono label" font-size="10" font-weight="600">THE CONSTITUTIONAL MODEL</text>

  <!-- Sovereign -->
  <g transform="translate(36, 66)">
    <rect width="220" height="250" rx="12" class="card"/>
    <text x="110" y="30" class="mono label" font-size="9" font-weight="600" text-anchor="middle">THE SOVEREIGN · YOU</text>
    <g transform="translate(110, 80)">
      <path d="M -26 16 L -28 -12 L -13 0 L 0 -20 L 13 0 L 28 -12 L 26 16 Z" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="-26" y1="24" x2="26" y2="24" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="0" cy="5" r="2.5" fill="#1a1a1a"/>
    </g>
    <text x="110" y="142" class="ui title" font-size="16" text-anchor="middle">Sets the direction</text>
    <line x1="24" y1="162" x2="196" y2="162" stroke="#efefef"/>
    <text x="40" y="188" class="ui" font-size="11.5" fill="#333333"><tspan fill="#111111" font-weight="700">✓</tspan>  Issues edicts</text>
    <text x="40" y="212" class="ui" font-size="11.5" fill="#333333"><tspan fill="#111111" font-weight="700">✓</tspan>  Grants assent</text>
    <text x="40" y="236" class="ui" font-size="11.5" fill="#a3a3a3">✗  Drafts decrees</text>
  </g>

  <!-- 1 · delegate -->
  <text x="430" y="118" class="mono label" font-size="9" font-weight="600" text-anchor="middle">1 · DELEGATE</text>
  <text x="430" y="140" class="ui" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">“Ship v0.18 &amp; audit the API”</text>
  <line x1="272" y1="156" x2="588" y2="156" class="wire" stroke="#555555" marker-end="url(#sd-arrow)"/>

  <!-- 2 · assent -->
  <text x="430" y="232" class="mono label" font-size="9" font-weight="600" text-anchor="middle">2 · ASSENT ONLY</text>
  <text x="430" y="254" class="ui" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">Only real decisions come back</text>
  <line x1="588" y1="270" x2="272" y2="270" class="wire" stroke-dasharray="4 4" marker-end="url(#sd-arrow)"/>

  <!-- Regent -->
  <g transform="translate(604, 66)">
    <rect width="240" height="106" rx="12" class="card-em"/>
    <text x="18" y="30" class="mono label" font-size="9" font-weight="600">THE REGENT</text>
    <use href="#sd-mark" transform="translate(18, 44) scale(1.2)"/>
    <text x="60" y="66" class="ui title" font-size="17">Regent</text>
    <text x="60" y="84" class="ui body" font-size="11">Governs the ministers</text>
  </g>

  <!-- dispatch tree -->
  <path d="M 724 172 V 196 M 643 216 V 204 Q 643 196 651 196 H 797 Q 805 196 805 204 V 216 M 724 196 V 216" class="wire" stroke="#bdbdbd"/>

  <g text-anchor="middle">
    <g transform="translate(604, 220)">
      <rect width="78" height="96" rx="10" class="card"/>
      <use href="#sd-face" transform="translate(28, 24)"/>
      <text x="39" y="72" class="ui title" font-size="11.5">Research</text>
    </g>
    <g transform="translate(685, 220)">
      <rect width="78" height="96" rx="10" class="card"/>
      <use href="#sd-face" transform="translate(28, 24)"/>
      <text x="39" y="72" class="ui title" font-size="11.5">Coding</text>
    </g>
    <g transform="translate(766, 220)">
      <rect width="78" height="96" rx="10" class="card"/>
      <use href="#sd-face" transform="translate(28, 24)"/>
      <text x="39" y="72" class="ui title" font-size="11.5">Writing</text>
    </g>
  </g>
</svg>
