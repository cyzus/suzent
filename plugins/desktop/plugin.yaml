id: desktop
name: Desktop
version: 1.2.0
description: Drive native desktop apps through the agent-desktop CLI. Off until you install this plugin.
api_version: 3
default_enabled: false
binaries:
  - name: agent-desktop
    version: 1.2.0
    package: agent-desktop
    # sha256 of the agent-desktop tarball as published on npm.
    sha256: 9e4b1a69d9d6be487873a1df8db61234a8b7a9c79aeced4e403a8126c0e0bcc0
    max_bytes: 31457280
    env: SUZENT_AGENT_DESKTOP_BIN
    platforms:
      darwin-arm64:
        files:
          agent-desktop: bin/agent-desktop-darwin-arm64
          agent-desktop-macos-helper: bin/agent-desktop-macos-helper-darwin-arm64
      darwin-x64:
        files:
          agent-desktop: bin/agent-desktop-darwin-x64
          agent-desktop-macos-helper: bin/agent-desktop-macos-helper-darwin-x64
      linux-arm64:
        files:
          agent-desktop: bin/agent-desktop-linux-arm64
          agent-desktop-linux-clipboard-owner: bin/agent-desktop-linux-clipboard-owner-linux-arm64
      linux-x64:
        files:
          agent-desktop: bin/agent-desktop-linux-x64
          agent-desktop-linux-clipboard-owner: bin/agent-desktop-linux-clipboard-owner-linux-x64
      win32-arm64:
        files:
          agent-desktop.exe: bin/agent-desktop-win32-arm64.exe
      win32-x64:
        files:
          agent-desktop.exe: bin/agent-desktop-win32-x64.exe
    after_install:
      darwin: [permissions, --guide]
    notice: >-
      agent-desktop can read and operate the apps on this computer, outside the
      chat sandbox. On Windows the program is unsigned, so SmartScreen,
      antivirus software or Smart App Control may block it. On macOS it needs
      Accessibility permission; Suzent opens the permission guide after the
      install.
