[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suzent"
version = "0.10.0"
description = "Your personal Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.7.3",
    "pydantic-ai-slim[openai,anthropic,google,groq,mcp,ag-ui]>=2.18,<3",
    "litellm",
    "starlette>=1.0.0,<2.0.0",
    "uvicorn",
    "python-dotenv",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    "markitdown[all]",
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "lancedb>=0.17.0",
    "ddgs>=9.10.0",
    "sqlmodel>=0.0.22",
    "typer>=0.9.0",
    "playwright>=1.41.0",
    "nest-asyncio>=1.6.0",
    "psutil>=5.9.0",
    "zeroconf>=0.131.0",
    "fastapi>=0.128.5",
    "wsproto>=1.3.2",
    "sounddevice>=0.5.5",
    "opencv-python>=4.8.0",
    "croniter>=2.0.0",
    "docker>=7.0",
    "prompt_toolkit>=3.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
suzent = "suzent.cli:app"


[project.optional-dependencies]
# Kept for backwards compatibility, but memory is now required
social = [
    "python-telegram-bot>=22.6",
    "markdown>=3.6",
    "lark-oapi>=1.5.3",
    "slack_sdk>=3.0.0",
    "discord.py>=2.0.0",
    "zstandard>=0.23.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "build>=1.0.0",
    "zstandard",
    # Dev-only: the official A2A SDK drives our A2A server in the conformance
    # test, so protocol correctness is verified against the reference client
    # rather than against our own assumptions. Not a runtime dependency —
    # suzent.a2a hand-rolls the wire types to stay in the Starlette route style.
    "a2a-sdk>=1.1.0",
]

# All optional dependencies
all = [
    "suzent[social,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "sandbox: marks tests that require Docker daemon (deselect with '-m \"not sandbox\"')",
    "integration: marks tests that require external services",
    "slow: marks tests that take significant time to run",
    "stress: marks stress/load tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]


