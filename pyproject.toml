[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suzent"
version = "0.26.0"
description = "Suzent is a sovereign AI agent: own its memory, govern its actions, choose its intelligence, and keep its continuity."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = [
    "sovereign-ai-agent",
    "sovereign-agent",
    "agent-sovereignty",
    "ai-agent",
    "local-first",
    "personal-ai-agent",
    "self-hosted",
    "llm",
    "agent-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic-ai-slim[openai,anthropic,google,groq,mcp,ag-ui,web-fetch]>=2.64,<3",
    # Exact pin: litellm 1.82.7/1.82.8 on PyPI were compromised (Mar 2026). Bump
    # deliberately, after checking the release and the uv.lock hashes.
    "litellm==1.81.13",
    "starlette>=1.0.0,<2.0.0",
    "uvicorn",
    "python-dotenv",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    # Document converters for read_file (tools/filesystem/doc_convert.py),
    # called directly instead of through MarkItDown, whose file-type detector
    # (magika -> onnxruntime -> sympy) and pandas spreadsheet path cost ~170 MB.
    "pdfminer.six>=20251107",
    "mammoth>=1.11.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "olefile>=0.47",
    "markdownify>=1.2",
    # SpeechOutput decodes compressed TTS audio (MP3/OGG/AAC) with pydub. It
    # used to arrive via markitdown[all]; declare it so trimming extras cannot
    # drop it again. audioop left the stdlib in 3.13.
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "lancedb>=0.17.0",
    "ddgs>=9.10.0",
    "sqlmodel>=0.0.22",
    "typer>=0.9.0",
    "playwright>=1.41.0",
    "nest-asyncio>=1.6.0",
    "psutil>=5.9.0",
    "zeroconf>=0.131.0",
    "fastapi>=0.128.5",
    "wsproto>=1.3.2",
    "sounddevice>=0.5.5",
    "croniter>=2.0.0",
    "docker>=7.0",
    "prompt_toolkit>=3.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "pydantic-ai-harness[codemode]>=0.64,<0.65",
    # Code mode's sandbox. Pinned exactly: upgrades are vetted by hand.
    "pydantic-monty==1.4.0",
    "websockets>=15",
]

[project.urls]
Homepage = "https://suzent.com"
Documentation = "https://suzent.com/docs/getting-started/intro"
"What is a sovereign AI agent?" = "https://suzent.com/sovereign"
Repository = "https://github.com/cyzus/suzent"
Issues = "https://github.com/cyzus/suzent/issues"
Changelog = "https://github.com/cyzus/suzent/blob/main/CHANGELOG.md"

[project.scripts]
suzent = "suzent.cli:app"


[project.optional-dependencies]
# Kept for backwards compatibility, but memory is now required
# One extra per chat app, each installed by the plugin of the same name
# (plugins/<name>/plugin.yaml). `social` keeps installing all of them.
telegram = [
    "python-telegram-bot>=22.6",
    "markdown>=3.6",
]
slack = ["slack_sdk>=3.0.0"]
discord = ["discord.py>=2.0.0"]
feishu = ["lark-oapi>=1.5.3"]
# Webcam capture for the local node's camera.snap, installed by the camera
# plugin (plugins/camera/plugin.yaml). Headless: no GUI toolkit is needed.
camera = ["opencv-python-headless>=4.8.0"]
social = [
    "suzent[telegram,slack,discord,feishu]",
    "zstandard>=0.23.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "build>=1.0.0",
    "zstandard",
    # Dev-only: the official A2A SDK drives our A2A server in the conformance
    # test, so protocol correctness is verified against the reference client
    # rather than against our own assumptions. Not a runtime dependency —
    # suzent.a2a hand-rolls the wire types to stay in the Starlette route style.
    "a2a-sdk>=1.1.0",
]

# All optional dependencies
all = [
    "suzent[social,camera,dev]",
]

# The web UI is a build artifact (scripts/build_webui.py), so it is gitignored
# and hatchling would otherwise drop it from the wheel. Naming it here ships it
# as package data when present, without failing a source-only build when absent.
[tool.hatch.build.targets.wheel]
packages = ["src/suzent"]
artifacts = ["src/suzent/webui/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/suzent/webui/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "sandbox: marks tests that require Docker daemon (deselect with '-m \"not sandbox\"')",
    "integration: marks tests that require external services",
    "slow: marks tests that take significant time to run",
    "stress: marks stress/load tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]


