[project]
name = "suzent-acp"
version = "0.1.0"
description = "Use the Suzent installed on this computer as an Agent Client Protocol agent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://suzent.com"
Repository = "https://github.com/cyzus/suzent"
Documentation = "https://suzent.com/docs"

[project.scripts]
suzent-acp = "suzent_acp.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suzent_acp"]
