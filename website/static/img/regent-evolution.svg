<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Before and after Regent: moving from human-as-router across many chat tabs to a single point of attention.">
  <defs>
    <marker id="ev-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ev-arrow-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#b0b0b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="ev-mark">
      <path d="M3 3.6 Q12 0 21 3.6 L21 6.6 Q12 10.2 3 6.6 Z" fill="#1a1a1a"/>
      <rect x="10.3" y="5.3" width="3.4" height="3.4" rx="0.8" transform="rotate(45 12 7)" fill="#ffffff"/>
      <rect x="0" y="9.6" width="24" height="24" rx="5" fill="#1a1a1a"/>
      <rect x="5" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
      <rect x="14" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
    </g>
    <g id="ev-lines">
      <rect x="10" y="38" width="66" height="3.5" rx="1.75" fill="#e6e6e6"/>
      <rect x="10" y="47" width="54" height="3.5" rx="1.75" fill="#e6e6e6"/>
      <rect x="10" y="56" width="62" height="3.5" rx="1.75" fill="#e6e6e6"/>
      <rect x="10" y="65" width="40" height="3.5" rx="1.75" fill="#e6e6e6"/>
    </g>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .title { fill: #111111; font-weight: 650; }
    .wire { fill: none; stroke: #8f8f8f; stroke-width: 1.25; }
    .tangle { fill: none; stroke: #c2c2c2; stroke-width: 1.1; }
  </style>

  <rect x="0" y="0" width="880" height="420" rx="14" fill="#fafafa"/>
  <line x1="440" y1="28" x2="440" y2="392" stroke="#e6e6e6"/>

  <!-- ============ LEFT: without Regent ============ -->
  <text x="32" y="42" class="mono label" font-size="9.5" font-weight="600">01 · WITHOUT REGENT</text>
  <text x="32" y="64" class="ui title" font-size="16">Human as router</text>

  <g transform="translate(134, 92)">
    <rect width="180" height="50" rx="10" class="card"/>
    <text x="90" y="22" class="ui title" font-size="14" text-anchor="middle">You</text>
    <text x="90" y="39" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="middle">polling every tab</text>
  </g>
  <rect x="166" y="83" width="116" height="17" rx="8.5" fill="#f2f2f2" stroke="#dcdcdc"/>
  <text x="224" y="94.5" class="mono" font-size="8" fill="#555555" text-anchor="middle" letter-spacing="0.06em">attention bottleneck</text>

  <!-- tangle -->
  <line x1="74" y1="232" x2="190" y2="146" class="tangle" marker-start="url(#ev-arrow-l)" marker-end="url(#ev-arrow-l)"/>
  <line x1="174" y1="232" x2="210" y2="146" class="tangle" marker-start="url(#ev-arrow-l)" marker-end="url(#ev-arrow-l)"/>
  <line x1="274" y1="232" x2="238" y2="146" class="tangle" marker-start="url(#ev-arrow-l)" marker-end="url(#ev-arrow-l)"/>
  <line x1="374" y1="232" x2="258" y2="146" class="tangle" marker-start="url(#ev-arrow-l)" marker-end="url(#ev-arrow-l)"/>
  <rect x="174" y="179" width="100" height="20" rx="10" fill="#fafafa" stroke="#dcdcdc"/>
  <text x="224" y="192.5" class="mono" font-size="8.5" fill="#666666" text-anchor="middle">raw transcripts</text>

  <!-- sessions -->
  <g transform="translate(30, 236)">
    <rect width="88" height="112" rx="8" class="card"/>
    <circle cx="13" cy="17" r="2.5" fill="#bdbdbd"/>
    <text x="21" y="20.5" class="ui" font-size="10.5" font-weight="600" fill="#333333">Research</text>
    <line x1="0" y1="29" x2="88" y2="29" stroke="#efefef"/>
    <use href="#ev-lines"/>
    <rect x="10" y="84" width="68" height="16" rx="4" fill="#f2f2f2"/>
    <text x="44" y="95" class="mono" font-size="8" fill="#555555" text-anchor="middle">2,400 words</text>
  </g>
  <g transform="translate(130, 236)">
    <rect width="88" height="112" rx="8" class="card"/>
    <circle cx="13" cy="17" r="2.5" fill="#bdbdbd"/>
    <text x="21" y="20.5" class="ui" font-size="10.5" font-weight="600" fill="#333333">Coding</text>
    <line x1="0" y1="29" x2="88" y2="29" stroke="#efefef"/>
    <use href="#ev-lines"/>
    <rect x="10" y="84" width="68" height="16" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="44" y="95" class="mono" font-size="8" font-weight="600" fill="#1a1a1a" text-anchor="middle">blocked?</text>
  </g>
  <g transform="translate(230, 236)">
    <rect width="88" height="112" rx="8" class="card"/>
    <circle cx="13" cy="17" r="2.5" fill="#bdbdbd"/>
    <text x="21" y="20.5" class="ui" font-size="10.5" font-weight="600" fill="#333333">Writing</text>
    <line x1="0" y1="29" x2="88" y2="29" stroke="#efefef"/>
    <use href="#ev-lines"/>
    <rect x="10" y="84" width="68" height="16" rx="4" fill="#f2f2f2"/>
    <text x="44" y="95" class="mono" font-size="8" fill="#555555" text-anchor="middle">idle 2 hrs</text>
  </g>
  <g transform="translate(330, 236)">
    <rect width="88" height="112" rx="8" class="card"/>
    <circle cx="13" cy="17" r="2.5" fill="#bdbdbd"/>
    <text x="21" y="20.5" class="ui" font-size="10.5" font-weight="600" fill="#333333">Ops</text>
    <line x1="0" y1="29" x2="88" y2="29" stroke="#efefef"/>
    <use href="#ev-lines"/>
    <rect x="10" y="74" width="58" height="3.5" rx="1.75" fill="#e6e6e6"/>
    <rect x="10" y="83" width="66" height="3.5" rx="1.75" fill="#e6e6e6"/>
  </g>

  <text x="224" y="384" class="ui" font-size="12.5" fill="#555555" text-anchor="middle">Every session is another inbox to babysit.</text>

  <!-- transition -->
  <circle cx="440" cy="214" r="15" fill="#fafafa" stroke="#e0e0e0"/>
  <path d="M 433 214 H 446 M 441 209 L 446 214 L 441 219" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ RIGHT: with Regent ============ -->
  <text x="464" y="42" class="mono label" font-size="9.5" font-weight="600">02 · WITH REGENT</text>
  <text x="464" y="64" class="ui title" font-size="16">Single point of attention</text>

  <g transform="translate(561, 92)">
    <rect width="190" height="50" rx="10" class="card"/>
    <text x="95" y="22" class="ui title" font-size="14" text-anchor="middle">You</text>
    <text x="95" y="39" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="middle">decisions only</text>
  </g>
  <line x1="656" y1="142" x2="656" y2="164" class="wire" marker-end="url(#ev-arrow)"/>

  <g transform="translate(506, 168)">
    <rect width="300" height="64" rx="12" class="card-em"/>
    <use href="#ev-mark" transform="translate(18, 14) scale(1.05)"/>
    <text x="58" y="30" class="ui title" font-size="16">Regent</text>
    <text x="58" y="48" class="mono" font-size="9" fill="#8a8a8a">dispatches · filters</text>
  </g>

  <path d="M 656 232 V 250 M 509 268 V 258 Q 509 250 517 250 H 795 Q 803 250 803 258 V 268 M 607 250 V 268 M 705 250 V 268" class="wire" stroke="#bdbdbd"/>

  <g text-anchor="middle">
    <g transform="translate(465, 272)">
      <rect width="88" height="70" rx="8" class="card"/>
      <text x="44" y="26" class="ui title" font-size="12">Research</text>
      <rect x="12" y="38" width="64" height="18" rx="9" fill="#f2f2f2"/>
      <text x="44" y="50" class="mono" font-size="8" fill="#555555">● running</text>
    </g>
    <g transform="translate(563, 272)">
      <rect width="88" height="70" rx="8" class="card"/>
      <text x="44" y="26" class="ui title" font-size="12">Coding</text>
      <rect x="12" y="38" width="64" height="18" rx="9" fill="#1a1a1a"/>
      <text x="44" y="50" class="mono" font-size="8" fill="#ffffff">▲ 1 blocker</text>
    </g>
    <g transform="translate(661, 272)">
      <rect width="88" height="70" rx="8" class="card"/>
      <text x="44" y="26" class="ui title" font-size="12">Writing</text>
      <rect x="12" y="38" width="64" height="18" rx="9" fill="#f2f2f2"/>
      <text x="44" y="50" class="mono" font-size="8" fill="#555555">● running</text>
    </g>
    <g transform="translate(759, 272)">
      <rect width="88" height="70" rx="8" class="card"/>
      <text x="44" y="26" class="ui title" font-size="12">Ops</text>
      <rect x="12" y="38" width="64" height="18" rx="9" fill="#f2f2f2"/>
      <text x="44" y="50" class="mono" font-size="8" fill="#555555">✓ quiet ok</text>
    </g>
  </g>

  <text x="656" y="384" class="ui" font-size="12.5" font-weight="650" fill="#111111" text-anchor="middle">You talk to Regent. Regent runs the projects.</text>
</svg>
