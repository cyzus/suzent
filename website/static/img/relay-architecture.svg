<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Suzent on your computer connects out to a relay you deploy. Your phone and webhook callers such as GitHub reach Suzent through that relay. Nothing is opened on your home router and there is no Suzent cloud in the middle.">
  <defs>
    <marker id="ra-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ra-arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#8f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
  </style>

  <rect x="0" y="0" width="880" height="360" rx="14" fill="#fafafa"/>

  <!-- Home zone -->
  <rect x="24" y="24" width="248" height="312" rx="12" fill="#f1f1f1"/>
  <text x="44" y="50" class="mono label" font-size="9.5" font-weight="600">AT HOME</text>

  <g transform="translate(44, 70)">
    <rect x="0" y="0" width="208" height="128" rx="10" class="card-em"/>
    <text x="18" y="30" class="ui" font-size="15" font-weight="600" fill="#1a1a1a">Suzent</text>
    <text x="18" y="50" class="ui" font-size="11.5" fill="#6b6b6b">on your computer</text>
    <line x1="18" y1="66" x2="190" y2="66" stroke="#ececec"/>
    <text x="18" y="86" class="mono" font-size="9.5" fill="#6b6b6b">memory · files · projects</text>
    <text x="18" y="104" class="mono" font-size="9.5" fill="#6b6b6b">models · approvals</text>
  </g>

  <!-- router -->
  <g transform="translate(44, 222)">
    <rect x="0" y="0" width="208" height="90" rx="10" class="card"/>
    <text x="18" y="28" class="ui" font-size="12.5" font-weight="600" fill="#1a1a1a">Home router</text>
    <text x="18" y="50" class="ui" font-size="11" fill="#6b6b6b">No open ports.</text>
    <text x="18" y="67" class="ui" font-size="11" fill="#6b6b6b">No fixed IP. No VPN.</text>
  </g>

  <!-- outbound connection -->
  <line x1="252" y1="134" x2="372" y2="134" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ra-arrow)"/>
  <text x="312" y="120" class="mono" font-size="9" fill="#1a1a1a" text-anchor="middle">connects out,</text>
  <text x="312" y="152" class="mono" font-size="9" fill="#1a1a1a" text-anchor="middle">stays open</text>

  <!-- Relay -->
  <g transform="translate(380, 70)">
    <rect x="0" y="0" width="200" height="220" rx="10" class="card-em"/>
    <text x="18" y="30" class="mono label" font-size="9.5" font-weight="600">YOUR RELAY</text>
    <text x="18" y="56" class="ui" font-size="15" font-weight="600" fill="#1a1a1a">suzent-relay</text>
    <text x="18" y="76" class="ui" font-size="11.5" fill="#6b6b6b">deployed by you</text>
    <line x1="18" y1="92" x2="182" y2="92" stroke="#ececec"/>
    <text x="18" y="114" class="ui" font-size="11" fill="#333333">Cloudflare Workers (free)</text>
    <text x="18" y="132" class="ui" font-size="11" fill="#333333">or Docker on any server</text>
    <line x1="18" y1="148" x2="182" y2="148" stroke="#ececec"/>
    <text x="18" y="170" class="ui" font-size="11" fill="#6b6b6b">Passes requests along.</text>
    <text x="18" y="188" class="ui" font-size="11" fill="#6b6b6b">Keeps nothing on disk.</text>
  </g>

  <!-- phone -->
  <g transform="translate(672, 70)">
    <rect x="0" y="0" width="184" height="100" rx="10" class="card"/>
    <text x="18" y="30" class="ui" font-size="13.5" font-weight="600" fill="#1a1a1a">Your phone</text>
    <text x="18" y="50" class="ui" font-size="11" fill="#6b6b6b">any network,</text>
    <text x="18" y="66" class="ui" font-size="11" fill="#6b6b6b">mobile data included</text>
    <rect x="18" y="76" width="96" height="16" rx="8" fill="#1a1a1a"/>
    <text x="66" y="87.5" class="mono" font-size="8.5" fill="#ffffff" text-anchor="middle">END-TO-END</text>
  </g>
  <line x1="668" y1="120" x2="588" y2="134" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ra-arrow)"/>

  <!-- webhooks -->
  <g transform="translate(672, 196)">
    <rect x="0" y="0" width="184" height="94" rx="10" class="card"/>
    <text x="18" y="30" class="ui" font-size="13.5" font-weight="600" fill="#1a1a1a">Webhook callers</text>
    <text x="18" y="50" class="ui" font-size="11" fill="#6b6b6b">GitHub, payments,</text>
    <text x="18" y="66" class="ui" font-size="11" fill="#6b6b6b">forms</text>
  </g>
  <line x1="668" y1="243" x2="588" y2="226" stroke="#8f8f8f" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ra-arrow-g)"/>

  <text x="480" y="320" class="mono" font-size="9.5" fill="#8a8a8a" text-anchor="middle">NO SUZENT CLOUD IN THE MIDDLE</text>
</svg>
