<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="End-to-end encryption through the relay. Pairing puts your computer's public key on the phone. The phone sends a fresh key, your computer replies with proof it holds the matching private key, and from then on every message is AES-256-GCM encrypted and numbered. The relay only ever sees ciphertext.">
  <defs>
    <marker id="rh-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="rh-arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#8f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .step { fill: #1a1a1a; }
  </style>

  <rect x="0" y="0" width="880" height="400" rx="14" fill="#fafafa"/>

  <!-- lane heads -->
  <rect x="40" y="24" width="160" height="40" rx="8" class="card-em"/>
  <text x="120" y="49" class="ui" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Phone</text>
  <rect x="360" y="24" width="160" height="40" rx="8" class="card"/>
  <text x="440" y="49" class="ui" font-size="13" font-weight="600" fill="#6b6b6b" text-anchor="middle">Your relay</text>
  <rect x="680" y="24" width="160" height="40" rx="8" class="card-em"/>
  <text x="760" y="49" class="ui" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Your computer</text>

  <!-- lifelines -->
  <line x1="120" y1="64" x2="120" y2="372" stroke="#cfcfcf" stroke-width="1.25"/>
  <line x1="440" y1="64" x2="440" y2="372" stroke="#cfcfcf" stroke-width="1.25" stroke-dasharray="3 4"/>
  <line x1="760" y1="64" x2="760" y2="372" stroke="#cfcfcf" stroke-width="1.25"/>

  <!-- step 0: pairing, direct -->
  <circle cx="34" cy="104" r="10" class="step"/>
  <text x="34" y="107.5" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <path d="M 756 104 C 600 86, 280 86, 126 104" fill="none" stroke="#8f8f8f" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#rh-arrow-g)"/>
  <text x="440" y="82" class="ui" font-size="11.5" fill="#333333" text-anchor="middle">Pairing QR code carries the computer's public key (scanned in person)</text>

  <!-- step 1 -->
  <circle cx="34" cy="160" r="10" class="step"/>
  <text x="34" y="163.5" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <line x1="124" y1="160" x2="752" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#rh-arrow)"/>
  <rect x="200" y="132" width="200" height="20" rx="4" fill="#fafafa"/>
  <text x="208" y="146" class="ui" font-size="11.5" fill="#1a1a1a">Fresh key for this session</text>

  <!-- step 2 -->
  <circle cx="34" cy="220" r="10" class="step"/>
  <text x="34" y="223.5" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="756" y1="220" x2="128" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#rh-arrow)"/>
  <rect x="470" y="192" width="276" height="20" rx="4" fill="#fafafa"/>
  <text x="740" y="206" class="ui" font-size="11.5" fill="#1a1a1a" text-anchor="end">Its own fresh key + proof it holds the private key</text>
  <text x="140" y="246" class="mono" font-size="9" fill="#6b6b6b">phone checks the proof, or stops</text>

  <!-- step 3 -->
  <circle cx="34" cy="296" r="10" class="step"/>
  <text x="34" y="299.5" class="mono" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="124" y1="290" x2="752" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#rh-arrow)" marker-end="url(#rh-arrow)"/>
  <line x1="124" y1="302" x2="752" y2="302" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#rh-arrow)" marker-end="url(#rh-arrow)"/>
  <rect x="152" y="268" width="250" height="16" rx="4" fill="#fafafa"/>
  <text x="160" y="280" class="ui" font-size="11.5" fill="#1a1a1a">Every message AES-256-GCM, numbered</text>

  <!-- relay note -->
  <rect x="356" y="316" width="168" height="44" rx="8" fill="#1a1a1a"/>
  <text x="440" y="334" class="mono" font-size="9" fill="#ffffff" text-anchor="middle">RELAY SEES ONLY</text>
  <text x="440" y="349" class="mono" font-size="9" fill="#ffffff" text-anchor="middle">CIPHERTEXT</text>
  <text x="560" y="336" class="ui" font-size="11" fill="#6b6b6b">Fake computer: fails step 2.</text>
  <text x="560" y="353" class="ui" font-size="11" fill="#6b6b6b">Changed, replayed or dropped message: fails step 3.</text>
</svg>
