<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="A tool registers a source and prints its id next to the evidence. The model copies the id into an invisible marker. The desktop and phone apps render a badge, chat apps get a numbered reference and a source list, and a sub-agent's sources are renamed before they reach the main agent.">
  <defs>
    <marker id="cp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
  </style>

  <rect x="0" y="0" width="880" height="400" rx="14" fill="#fafafa"/>

  <!-- 1. tool -->
  <g transform="translate(24, 60)">
    <text x="0" y="-16" class="mono label" font-size="9.5" font-weight="600">1 · TOOL ASSIGNS THE ID</text>
    <rect x="0" y="0" width="236" height="200" rx="10" class="card"/>
    <text x="16" y="28" class="mono" font-size="10" fill="#6b6b6b">web_fetch(metoffice.gov.uk/…)</text>
    <line x1="0" y1="42" x2="236" y2="42" stroke="#ececec"/>
    <rect x="12" y="56" width="74" height="18" rx="4" fill="#1a1a1a"/>
    <text x="49" y="69" class="mono" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">t3_src_2</text>
    <text x="94" y="69" class="ui" font-size="11" fill="#1a1a1a">Met Office</text>
    <text x="16" y="96" class="ui" font-size="11" fill="#333333">The highest temperature</text>
    <text x="16" y="112" class="ui" font-size="11" fill="#333333">recorded in the UK is 40.3°C,</text>
    <text x="16" y="128" class="ui" font-size="11" fill="#333333">at Coningsby on 19 July 2022 …</text>
    <line x1="16" y1="148" x2="220" y2="148" stroke="#ececec"/>
    <text x="16" y="168" class="ui" font-size="10.5" fill="#6b6b6b">Registered once, deduplicated,</text>
    <text x="16" y="184" class="ui" font-size="10.5" fill="#6b6b6b">prefixed with the turn number</text>
  </g>

  <line x1="264" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#cp-arrow)"/>

  <!-- 2. model -->
  <g transform="translate(308, 60)">
    <text x="0" y="-16" class="mono label" font-size="9.5" font-weight="600">2 · MODEL COPIES IT</text>
    <rect x="0" y="0" width="252" height="200" rx="10" class="card-em"/>
    <text x="16" y="30" class="ui" font-size="12" fill="#1a1a1a">The UK's record is 40.3°C</text>
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="38" height="20" rx="4" fill="#1a1a1a"/>
      <text x="19" y="13.5" class="mono" font-size="8.5" fill="#ffffff" text-anchor="middle">E200</text>
      <text x="44" y="14" class="mono" font-size="10.5" fill="#1a1a1a">cite</text>
      <rect x="76" y="0" width="38" height="20" rx="4" fill="#1a1a1a"/>
      <text x="95" y="13.5" class="mono" font-size="8.5" fill="#ffffff" text-anchor="middle">E202</text>
      <text x="120" y="14" class="mono" font-size="10.5" fill="#1a1a1a">t3_src_2</text>
      <rect x="182" y="0" width="38" height="20" rx="4" fill="#1a1a1a"/>
      <text x="201" y="13.5" class="mono" font-size="8.5" fill="#ffffff" text-anchor="middle">E201</text>
    </g>
    <text x="16" y="92" class="ui" font-size="12" fill="#1a1a1a">set in July 2022 …</text>
    <line x1="16" y1="116" x2="236" y2="116" stroke="#ececec"/>
    <text x="16" y="138" class="ui" font-size="10.5" fill="#6b6b6b">Private Use Area characters:</text>
    <text x="16" y="154" class="ui" font-size="10.5" fill="#6b6b6b">never in real text, so never</text>
    <text x="16" y="170" class="ui" font-size="10.5" fill="#6b6b6b">mistaken for Markdown, code</text>
    <text x="16" y="186" class="ui" font-size="10.5" fill="#6b6b6b">or a footnote</text>
  </g>

  <line x1="564" y1="160" x2="596" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#cp-arrow)"/>
  <line x1="564" y1="160" x2="596" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#cp-arrow)"/>
  <line x1="564" y1="160" x2="596" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#cp-arrow)"/>

  <!-- 3. outputs -->
  <text x="604" y="44" class="mono label" font-size="9.5" font-weight="600">3 · RENDERED FOR EACH PLACE</text>
  <g transform="translate(604, 60)">
    <rect x="0" y="0" width="252" height="80" rx="10" class="card"/>
    <text x="16" y="24" class="mono label" font-size="9" font-weight="600">DESKTOP · PHONE</text>
    <text x="16" y="52" class="ui" font-size="12" fill="#1a1a1a">The UK's record is 40.3°C</text>
    <rect x="178" y="39" width="66" height="18" rx="9" fill="#f1f1f1" stroke="#cfcfcf"/>
    <text x="211" y="52" class="ui" font-size="10" fill="#1a1a1a" text-anchor="middle">metoffice</text>
    <text x="16" y="70" class="ui" font-size="10" fill="#8a8a8a">badge opens the page or file</text>
  </g>
  <g transform="translate(604, 160)">
    <rect x="0" y="0" width="252" height="80" rx="10" class="card"/>
    <text x="16" y="24" class="mono label" font-size="9" font-weight="600">SLACK · TELEGRAM · ACP</text>
    <text x="16" y="48" class="ui" font-size="12" fill="#1a1a1a">The UK's record is 40.3°C [1]</text>
    <text x="16" y="68" class="mono" font-size="9.5" fill="#6b6b6b">Sources: [1] Met Office — https://…</text>
  </g>
  <g transform="translate(604, 260)">
    <rect x="0" y="0" width="252" height="80" rx="10" class="card"/>
    <text x="16" y="24" class="mono label" font-size="9" font-weight="600">SUB-AGENT → MAIN AGENT</text>
    <text x="16" y="48" class="mono" font-size="10.5" fill="#1a1a1a">t3_src_2 → sa_…_src_1</text>
    <text x="16" y="68" class="ui" font-size="10" fill="#8a8a8a">renamed so ids never collide</text>
  </g>

  <text x="440" y="378" class="mono" font-size="9.5" fill="#8a8a8a" text-anchor="middle">NO LABEL FROM A TOOL, NO CITATION</text>
</svg>
