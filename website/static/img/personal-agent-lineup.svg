<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="The 2026 personal-agent lineup across six vendors: Anthropic Claude Cowork, Apple Siri Intelligence, Microsoft Copilot, Meta Muse, OpenAI Dots, and Google Gemini Spark.">
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .glyph { fill: none; stroke: #1a1a1a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .tile { fill: #f2f2f2; }
    .name { fill: #111111; font-weight: 650; }
    .sub { fill: #8a8a8a; }
    .body { fill: #4d4d4d; }
  </style>

  <rect x="0" y="0" width="880" height="500" rx="14" fill="#fafafa"/>

  <!-- Header -->
  <text x="32" y="40" class="mono label" font-size="10" font-weight="600">01 · THE 2026 PERSONAL-AGENT LINEUP</text>
  <text x="848" y="40" class="mono label" font-size="10" text-anchor="end">FEB – SEP 2026</text>
  <text x="32" y="62" class="ui" font-size="16" font-weight="650" fill="#111111">Six vendors, one pitch</text>

  <!-- Card: Anthropic -->
  <g transform="translate(32, 82)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">ANTHROPIC</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">FEB 2026</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <path d="M 27 51 L 33 57 L 27 63" class="glyph"/>
    <line x1="36" y1="63" x2="43" y2="63" class="glyph"/>
    <text x="64" y="55" class="ui name" font-size="15">Claude Cowork</text>
    <text x="64" y="71" class="mono sub" font-size="9">CLOUD · WORKFLOW AUTOMATION</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">Automates multi-step business ops.</text>
    <text x="18" y="129" class="ui body" font-size="11.5">Launch wiped ~$285B off SaaS stocks.</text>
    
  </g>

  <!-- Card: Apple -->
  <g transform="translate(309, 82)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">APPLE</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">2026</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <rect x="28" y="50" width="14" height="14" rx="3" class="glyph"/>
    <path d="M 32 47 V 50 M 38 47 V 50 M 32 64 V 67 M 38 64 V 67 M 25 54 H 28 M 25 60 H 28 M 42 54 H 45 M 42 60 H 45" class="glyph"/>
    <text x="64" y="55" class="ui name" font-size="15">Siri Intelligence</text>
    <text x="64" y="71" class="mono sub" font-size="9">ON-DEVICE-FIRST · PRIVATE CLOUD</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">On-device where it can be,</text>
    <text x="18" y="129" class="ui body" font-size="11.5">but only on Apple hardware.</text>
    
  </g>

  <!-- Card: Microsoft -->
  <g transform="translate(586, 82)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">MICROSOFT</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">2026</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <rect x="26.5" y="48.5" width="7.5" height="7.5" rx="1.5" class="glyph"/>
    <rect x="36" y="48.5" width="7.5" height="7.5" rx="1.5" class="glyph"/>
    <rect x="26.5" y="58" width="7.5" height="7.5" rx="1.5" class="glyph"/>
    <rect x="36" y="58" width="7.5" height="7.5" rx="1.5" class="glyph"/>
    <text x="64" y="55" class="ui name" font-size="15">Microsoft Copilot</text>
    <text x="64" y="71" class="mono sub" font-size="9">CLOUD · THREE-HORIZON AI</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">Spans Windows, Office 365 and</text>
    <text x="18" y="129" class="ui body" font-size="11.5">the enterprise tenant graph.</text>
    
  </g>

  <!-- Card: Meta -->
  <g transform="translate(32, 240)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">META</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">SEP 8, 2026</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <circle cx="31.5" cy="57" r="6" class="glyph"/>
    <circle cx="38.5" cy="57" r="6" class="glyph"/>
    <text x="64" y="55" class="ui name" font-size="15">Meta Muse</text>
    <text x="64" y="71" class="mono sub" font-size="9">CLOUD · CONSUMER &amp; SMB</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">#1 app in the store; agents for</text>
    <text x="18" y="129" class="ui body" font-size="11.5">small businesses 3 weeks later.</text>
    
  </g>

  <!-- Card: OpenAI -->
  <g transform="translate(309, 240)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">OPENAI</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">SEP 29 · DEVDAY</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <circle cx="30.5" cy="52.5" r="3" class="glyph"/>
    <circle cx="39.5" cy="52.5" r="3" class="glyph"/>
    <circle cx="30.5" cy="61.5" r="3" class="glyph"/>
    <circle cx="39.5" cy="61.5" r="3" fill="#1a1a1a"/>
    <text x="64" y="55" class="ui name" font-size="15">OpenAI Dots</text>
    <text x="64" y="71" class="mono sub" font-size="9">CLOUD · GPT-6 ASTRA</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">Always-on background agents in</text>
    <text x="18" y="129" class="ui body" font-size="11.5">ChatGPT, Slack &amp; Teams.</text>
    
  </g>

  <!-- Card: Google -->
  <g transform="translate(586, 240)">
    <rect width="262" height="142" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">GOOGLE</text>
    <text x="244" y="26" class="mono sub" font-size="9" text-anchor="end">I/O 2026</text>
    <rect x="18" y="40" width="34" height="34" rx="8" class="tile"/>
    <path d="M 35 47 Q 36 56 45 57 Q 36 58 35 67 Q 34 58 25 57 Q 34 56 35 47 Z" class="glyph"/>
    <text x="64" y="55" class="ui name" font-size="15">Gemini Spark</text>
    <text x="64" y="71" class="mono sub" font-size="9">3.5 FLASH · ANTIGRAVITY</text>
    <line x1="18" y1="90" x2="244" y2="90" stroke="#efefef"/>
    <text x="18" y="112" class="ui body" font-size="11.5">Watches your inbox 24/7, built to</text>
    <text x="18" y="129" class="ui body" font-size="11.5" font-style="italic" fill="#111111">“eventually spend your money.”</text>
  </g>

  <!-- Takeaway -->
  <line x1="32" y1="410" x2="848" y2="410" stroke="#e6e6e6"/>
  <text x="440" y="446" class="ui" font-size="13.5" text-anchor="middle" fill="#555555"><tspan fill="#111111" font-weight="650">Same pitch:</tspan> always-on, on someone else’s computer, better the more of your life you feed it.</text>
</svg>
