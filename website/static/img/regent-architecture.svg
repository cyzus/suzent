<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-label="Regent architecture blueprint showing the full hierarchy: You at the top, Regent orchestrating across projects, autonomous Project Primary Sessions, and task-scoped Sub-agents at the bottom.">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="arch-mark">
      <path d="M3 3.6 Q12 0 21 3.6 L21 6.6 Q12 10.2 3 6.6 Z" fill="#1a1a1a"/>
      <rect x="10.3" y="5.3" width="3.4" height="3.4" rx="0.8" transform="rotate(45 12 7)" fill="#ffffff"/>
      <rect x="0" y="9.6" width="24" height="24" rx="5" fill="#1a1a1a"/>
      <rect x="5" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
      <rect x="14" y="17.6" width="5" height="5" rx="1.5" fill="#ffffff"/>
    </g>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .eph { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; stroke-dasharray: 3 3; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .title { fill: #111111; font-weight: 650; }
    .body { fill: #4d4d4d; }
    .wire { fill: none; stroke: #8f8f8f; stroke-width: 1.25; }
    .soft { fill: #f3f3f3; }
    .rowname { fill: #333333; font-weight: 600; letter-spacing: 0.06em; }
    .rowsub { fill: #9a9a9a; }
  </style>

  <rect x="0" y="0" width="880" height="580" rx="14" fill="#fafafa"/>

  <!-- row labels -->
  <g class="mono">
    <text x="28" y="66" class="rowname" font-size="9.5">01 · YOU</text>
    <text x="28" y="82" class="rowsub ui" font-size="10">One entry point</text>
    <text x="28" y="200" class="rowname" font-size="9.5">02 · REGENT</text>
    <text x="28" y="216" class="rowsub ui" font-size="10">Routes, never executes</text>
    <text x="28" y="358" class="rowname" font-size="9.5">03 · PROJECTS</text>
    <text x="28" y="374" class="rowsub ui" font-size="10">Durable sessions</text>
    <text x="28" y="494" class="rowname" font-size="9.5">04 · SUB-AGENTS</text>
    <text x="28" y="510" class="rowsub ui" font-size="10">Short-lived helpers</text>
  </g>
  <g stroke="#ececec">
    <line x1="28" y1="130" x2="852" y2="130"/>
    <line x1="28" y1="296" x2="852" y2="296"/>
    <line x1="28" y1="444" x2="852" y2="444"/>
  </g>

  <!-- ===== 01 You ===== -->
  <g transform="translate(176, 40)">
    <rect width="672" height="64" rx="12" class="card"/>
    <text x="22" y="38" class="ui title" font-size="18">You</text>
    <rect x="96" y="14" width="562" height="36" rx="8" class="soft"/>
    <text x="112" y="36" class="mono" font-size="10.5" fill="#111111"><tspan fill="#a3a3a3">&gt; </tspan>“Benchmark the new parser and draft the release post.”</text>
  </g>

  <line x1="470" y1="104" x2="470" y2="150" class="wire" marker-end="url(#arch-arrow)"/>
  <text x="460" y="131" class="mono" font-size="9" fill="#8a8a8a" text-anchor="end">intent</text>
  <line x1="530" y1="152" x2="530" y2="108" class="wire" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>
  <text x="540" y="131" class="mono" font-size="9" fill="#8a8a8a">1-line decisions</text>

  <!-- ===== 02 Regent ===== -->
  <g transform="translate(176, 154)">
    <rect width="556" height="110" rx="12" class="card-em"/>
    <use href="#arch-mark" transform="translate(18, 12) scale(0.82)"/>
    <text x="48" y="32" class="ui title" font-size="16">Regent</text>
    <rect x="446" y="17" width="94" height="18" rx="9" fill="#1a1a1a"/>
    <text x="493" y="29.5" class="mono" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">never executes</text>

    <g transform="translate(16, 50)">
      <rect width="168" height="44" rx="7" class="soft"/>
      <text x="12" y="19" class="mono" font-size="10" font-weight="700" fill="#111111">dispatch</text>
      <text x="12" y="34" class="ui body" font-size="10">Routes work, never waits</text>
    </g>
    <g transform="translate(194, 50)">
      <rect width="168" height="44" rx="7" class="soft"/>
      <text x="12" y="19" class="mono" font-size="10" font-weight="700" fill="#111111">filter</text>
      <text x="12" y="34" class="ui body" font-size="10">Surfaces only blockers</text>
    </g>
    <g transform="translate(372, 50)">
      <rect width="168" height="44" rx="7" class="soft"/>
      <text x="12" y="19" class="mono" font-size="10" font-weight="700" fill="#111111">heartbeat</text>
      <text x="12" y="34" class="ui body" font-size="10">Nudges stalled work</text>
    </g>
  </g>

  <!-- agent inbox -->
  <g transform="translate(748, 169)">
    <rect width="100" height="80" rx="10" class="card"/>
    <text x="50" y="24" class="mono label" font-size="8" font-weight="600" text-anchor="middle">INBOX</text>
    <text x="50" y="46" class="ui title" font-size="11.5" text-anchor="middle">Wakes Regent</text>
    <text x="50" y="62" class="ui" font-size="9.5" fill="#777777" text-anchor="middle">on block / end</text>
  </g>
  <line x1="748" y1="209" x2="736" y2="209" class="wire" marker-end="url(#arch-arrow)"/>
  <line x1="798" y1="314" x2="798" y2="253" class="wire" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>

  <!-- dispatch bus -->
  <path d="M 454 264 V 290 M 281 310 V 298 Q 281 290 289 290 H 721 Q 729 290 729 298 V 310 M 505 290 V 310" class="wire"/>
  <line x1="281" y1="300" x2="281" y2="316" class="wire" marker-end="url(#arch-arrow)"/>
  <line x1="505" y1="300" x2="505" y2="316" class="wire" marker-end="url(#arch-arrow)"/>
  <line x1="729" y1="300" x2="729" y2="316" class="wire" marker-end="url(#arch-arrow)"/>
  <rect x="414" y="280" width="80" height="20" rx="10" fill="#fafafa" stroke="#dcdcdc"/>
  <text x="454" y="293.5" class="mono" font-size="8.5" fill="#555555" text-anchor="middle">async</text>

  <!-- ===== 03 Projects ===== -->
  <g transform="translate(176, 320)">
    <rect width="210" height="96" rx="10" class="card"/>
    <text x="14" y="24" class="ui title" font-size="12.5">Research</text>
    <text x="196" y="24" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="end">running</text>
    <rect x="14" y="36" width="182" height="20" rx="5" class="soft"/>
    <text x="22" y="49.5" class="mono" font-size="8.5" fill="#333333">#04 Lit review</text>
    <rect x="14" y="62" width="182" height="20" rx="5" fill="#ffffff" stroke="#e6e6e6"/>
    <text x="22" y="75.5" class="mono" font-size="8.5" fill="#a3a3a3">#05 Synthesis</text>
  </g>
  <g transform="translate(400, 320)">
    <rect width="210" height="96" rx="10" class="card"/>
    <text x="14" y="24" class="ui title" font-size="12.5">Coding</text>
    <text x="196" y="24" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="end">waiting</text>
    <rect x="14" y="36" width="182" height="20" rx="5" class="soft"/>
    <text x="22" y="49.5" class="mono" font-size="8.5" fill="#8a8a8a">✓ #11 Parser bench</text>
    <rect x="14" y="62" width="182" height="20" rx="5" fill="#1a1a1a"/>
    <text x="22" y="75.5" class="mono" font-size="8.5" font-weight="600" fill="#ffffff">▲ Drop v1 API?</text>
  </g>
  <g transform="translate(624, 320)">
    <rect width="210" height="96" rx="10" class="card"/>
    <text x="14" y="24" class="ui title" font-size="12.5">Writing</text>
    <text x="196" y="24" class="mono" font-size="8.5" fill="#8a8a8a" text-anchor="end">running</text>
    <rect x="14" y="36" width="182" height="20" rx="5" class="soft"/>
    <text x="22" y="49.5" class="mono" font-size="8.5" fill="#333333">#02 Release post</text>
    <rect x="14" y="62" width="182" height="20" rx="5" fill="#ffffff" stroke="#e6e6e6"/>
    <text x="22" y="75.5" class="mono" font-size="8.5" fill="#a3a3a3">#03 Diagrams</text>
  </g>

  <!-- project → sub-agent links -->
  <g class="wire" stroke="#bdbdbd">
    <line x1="228" y1="416" x2="228" y2="462" marker-end="url(#arch-arrow)"/>
    <line x1="334" y1="416" x2="334" y2="462" marker-end="url(#arch-arrow)"/>
    <line x1="452" y1="416" x2="452" y2="462" marker-end="url(#arch-arrow)"/>
    <line x1="558" y1="416" x2="558" y2="462" marker-end="url(#arch-arrow)"/>
    <line x1="729" y1="416" x2="729" y2="462" marker-end="url(#arch-arrow)"/>
  </g>

  <!-- ===== 04 Sub-agents ===== -->
  <g text-anchor="middle">
    <g transform="translate(176, 466)">
      <rect width="104" height="52" rx="8" class="eph"/>
      <text x="52" y="21" class="mono" font-size="8.5" fill="#8a8a8a">web</text>
      <text x="52" y="38" class="ui" font-size="10.5" fill="#333333">Paper search</text>
    </g>
    <g transform="translate(282, 466)">
      <rect width="104" height="52" rx="8" class="eph"/>
      <text x="52" y="21" class="mono" font-size="8.5" fill="#8a8a8a">web</text>
      <text x="52" y="38" class="ui" font-size="10.5" fill="#333333">Citation check</text>
    </g>
    <g transform="translate(400, 466)">
      <rect width="104" height="52" rx="8" class="eph"/>
      <text x="52" y="21" class="mono" font-size="8.5" fill="#8a8a8a">explore</text>
      <text x="52" y="38" class="ui" font-size="10.5" fill="#333333">Find call sites</text>
    </g>
    <g transform="translate(506, 466)">
      <rect width="104" height="52" rx="8" class="eph"/>
      <text x="52" y="21" class="mono" font-size="8.5" fill="#8a8a8a">verify</text>
      <text x="52" y="38" class="ui" font-size="10.5" fill="#333333">Run tests</text>
    </g>
    <g transform="translate(624, 466)">
      <rect width="210" height="52" rx="8" class="eph"/>
      <text x="105" y="21" class="mono" font-size="8.5" fill="#8a8a8a">write · parallel</text>
      <text x="105" y="38" class="ui" font-size="10.5" fill="#333333">Draft diagrams</text>
    </g>
  </g>
  <text x="852" y="550" class="mono" font-size="8.5" fill="#a3a3a3" text-anchor="end">sub-agents report to their project, never to Regent</text>
</svg>
