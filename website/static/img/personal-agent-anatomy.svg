<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Anatomy of a personal agent: Identity, Memory, Authority, Continuity, and Permissions form the vehicle you own, while the model underneath is a swappable engine.">
  <defs>
    <marker id="anat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #dcdcdc; stroke-width: 1; }
    .card-em { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.25; }
    .label { fill: #8a8a8a; letter-spacing: 0.08em; }
    .tag { fill: #f2f2f2; }
    .title { fill: #111111; font-weight: 650; }
    .body { fill: #4d4d4d; }
    .note { fill: #1a1a1a; }
    .wire { fill: none; stroke: #c4c4c4; stroke-width: 1.25; }
  </style>

  <rect x="0" y="0" width="880" height="500" rx="14" fill="#fafafa"/>

  <!-- Header -->
  <text x="36" y="40" class="mono label" font-size="10" font-weight="600">02 · ANATOMY OF A PERSONAL AGENT</text>
  <text x="844" y="40" class="mono label" font-size="10" text-anchor="end">VEHICLE VS. ENGINE</text>

  <!-- connectors (behind cards) -->
  <line x1="276" y1="138" x2="350" y2="138" class="wire"/>
  <line x1="276" y1="298" x2="350" y2="298" class="wire"/>
  <line x1="530" y1="138" x2="604" y2="138" class="wire"/>
  <line x1="530" y1="298" x2="604" y2="298" class="wire"/>
  <circle cx="350" cy="138" r="2.5" fill="#9a9a9a"/>
  <circle cx="350" cy="298" r="2.5" fill="#9a9a9a"/>
  <circle cx="530" cy="138" r="2.5" fill="#9a9a9a"/>
  <circle cx="530" cy="298" r="2.5" fill="#9a9a9a"/>

  <!-- Memory -->
  <g transform="translate(36, 68)">
    <rect width="240" height="140" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">02 · MEMORY</text>
    <text x="18" y="54" class="ui title" font-size="15">What it remembers</text>
    <text x="18" y="74" class="ui body" font-size="11.5">Projects, people, preferences</text>
    <text x="18" y="90" class="ui body" font-size="11.5">and past decisions.</text>
    <line x1="18" y1="106" x2="222" y2="106" stroke="#efefef"/>
    <text x="18" y="125" class="mono note" font-size="9.5">Plain files, git-versioned</text>
  </g>

  <!-- Authority -->
  <g transform="translate(36, 228)">
    <rect width="240" height="140" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">03 · AUTHORITY</text>
    <text x="18" y="54" class="ui title" font-size="15">What it can do</text>
    <text x="18" y="74" class="ui body" font-size="11.5">Runs commands, edits files,</text>
    <text x="18" y="90" class="ui body" font-size="11.5">drives browsers.</text>
    <line x1="18" y1="106" x2="222" y2="106" stroke="#efefef"/>
    <text x="18" y="125" class="mono note" font-size="9.5">On your machine</text>
  </g>

  <!-- Continuity -->
  <g transform="translate(604, 68)">
    <rect width="240" height="140" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">04 · CONTINUITY</text>
    <text x="18" y="54" class="ui title" font-size="15">How it keeps running</text>
    <text x="18" y="74" class="ui body" font-size="11.5">Schedules and heartbeats that</text>
    <text x="18" y="90" class="ui body" font-size="11.5">work while you sleep.</text>
    <line x1="18" y1="106" x2="222" y2="106" stroke="#efefef"/>
    <text x="18" y="125" class="mono note" font-size="9.5">Survives provider shutdowns</text>
  </g>

  <!-- Permissions -->
  <g transform="translate(604, 228)">
    <rect width="240" height="140" rx="10" class="card"/>
    <text x="18" y="26" class="mono label" font-size="9" font-weight="600">05 · PERMISSIONS</text>
    <text x="18" y="54" class="ui title" font-size="15">Who sets the limits</text>
    <text x="18" y="74" class="ui body" font-size="11.5">Per-tool rules, scoped folders,</text>
    <text x="18" y="90" class="ui body" font-size="11.5">human approvals.</text>
    <line x1="18" y1="106" x2="222" y2="106" stroke="#efefef"/>
    <text x="18" y="125" class="mono note" font-size="9.5">Your code, not their ToS</text>
  </g>

  <!-- Identity (center) -->
  <g transform="translate(350, 98)">
    <rect width="180" height="240" rx="12" class="card-em"/>
    <text x="90" y="28" class="mono label" font-size="9" font-weight="600" text-anchor="middle">01 · IDENTITY</text>
    <rect x="66" y="48" width="48" height="44" rx="11" fill="#1a1a1a"/>
    <rect x="78" y="64" width="8" height="8" rx="2.5" fill="#ffffff"/>
    <rect x="94" y="64" width="8" height="8" rx="2.5" fill="#ffffff"/>
    <text x="90" y="126" class="ui title" font-size="16" text-anchor="middle">Who it is</text>
    <text x="90" y="156" class="ui body" font-size="11.5" text-anchor="middle">Persona, skills, habits.</text>
    
    <line x1="20" y1="186" x2="160" y2="186" stroke="#efefef"/>
    <text x="90" y="210" class="mono note" font-size="9.5" text-anchor="middle">Independent of model</text>
  </g>

  <!-- vehicle → engine -->
  <line x1="440" y1="338" x2="440" y2="398" class="wire" stroke="#8f8f8f" stroke-dasharray="4 4" marker-end="url(#anat-arrow)"/>
  <text x="452" y="372" class="mono" font-size="9" fill="#8a8a8a">API / local call</text>

  <!-- Engine row -->
  <g transform="translate(36, 404)">
    <rect width="808" height="64" rx="10" fill="#f0f0f0"/>
    <text x="22" y="29" class="ui title" font-size="14">The engine</text>
    <text x="22" y="46" class="mono label" font-size="8.5">SWAPPABLE PER SESSION</text>
    <g class="mono" font-size="10" fill="#333333" text-anchor="middle">
      <rect x="244" y="17" width="100" height="30" rx="7" fill="#ffffff" stroke="#dcdcdc"/>
      <text x="294" y="35.5">Claude</text>
      <rect x="356" y="17" width="100" height="30" rx="7" fill="#ffffff" stroke="#dcdcdc"/>
      <text x="406" y="35.5">GPT</text>
      <rect x="468" y="17" width="100" height="30" rx="7" fill="#ffffff" stroke="#dcdcdc"/>
      <text x="518" y="35.5">Gemini</text>
      <rect x="580" y="17" width="100" height="30" rx="7" fill="#ffffff" stroke="#dcdcdc"/>
      <text x="630" y="35.5">DeepSeek</text>
      <rect x="692" y="17" width="100" height="30" rx="7" fill="#ffffff" stroke="#dcdcdc" stroke-dasharray="3 3"/>
      <text x="742" y="35.5">Local / Ollama</text>
    </g>
  </g>
</svg>
