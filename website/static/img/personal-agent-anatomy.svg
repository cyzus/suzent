<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Anatomy of a personal agent: Identity, Memory, Authority, Continuity, and Permissions form the vehicle you own, while the model underneath is a swappable engine.">
  <defs>
    <pattern id="anat-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d8d8d8"/>
    </pattern>
    <pattern id="anat-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#dcdcdc" stroke-width="2"/>
    </pattern>
    <marker id="anat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #ffffff; stroke: #000000; stroke-width: 2.5; }
    .card-heavy { fill: #ffffff; stroke: #000000; stroke-width: 3; }
    .shadow { fill: #000000; }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <rect x="12" y="12" width="856" height="476" fill="url(#anat-grid)" stroke="#000000" stroke-width="3"/>

  <!-- Top Header Bar -->
  <rect x="12" y="12" width="856" height="42" fill="#000000"/>
  <rect x="28" y="22" width="32" height="22" fill="#ffffff"/>
  <text x="44" y="37" class="mono" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">02</text>
  <text x="72" y="38" class="mono" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">WHAT A PERSONAL AGENT IS MADE OF · VEHICLE VS. ENGINE</text>
  <text x="850" y="37" class="mono" font-size="10" fill="#bbbbbb" text-anchor="end">5 DURABLE PARTS</text>

  <!-- Connective Buses from Center Core (440, 224) -->
  <polyline points="350,190 296,190 296,136 276,136" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="296" cy="190" r="4" fill="#000000"/>

  <polyline points="350,256 296,256 296,314 276,314" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="296" cy="256" r="4" fill="#000000"/>

  <polyline points="530,190 584,190 584,136 604,136" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="584" cy="190" r="4" fill="#000000"/>

  <polyline points="530,256 584,256 584,314 604,314" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="584" cy="256" r="4" fill="#000000"/>

  <!-- ===================================================================== -->
  <!-- CENTER: 01 · IDENTITY (THE SELF)                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(350, 128)">
    <rect x="6" y="6" width="180" height="192" class="shadow"/>
    <rect x="0" y="0" width="180" height="192" class="card-heavy"/>
    <rect x="0" y="0" width="180" height="30" fill="#000000"/>
    <text x="90" y="20" class="mono" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">01 · IDENTITY</text>

    <!-- Suzent Robot Cube Mark -->
    <g transform="translate(62, 48)">
      <rect x="5" y="5" width="56" height="50" fill="url(#anat-hatch)" stroke="#000000" stroke-width="2"/>
      <rect x="0" y="0" width="56" height="50" fill="#000000"/>
      <rect x="10" y="17" width="12" height="12" fill="#ffffff"/>
      <rect x="34" y="17" width="12" height="12" fill="#ffffff"/>
    </g>

    <text x="90" y="124" class="ui" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">Who It Is</text>
    <text x="90" y="142" class="ui" font-size="11" fill="#333333" text-anchor="middle">Persona, skills, workspace,</text>
    <text x="90" y="157" class="ui" font-size="11" fill="#333333" text-anchor="middle">and learned conventions.</text>

    <rect x="14" y="166" width="152" height="18" fill="#000000"/>
    <text x="90" y="178" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">INDEPENDENT OF MODEL</text>
  </g>

  <!-- ===================================================================== -->
  <!-- TOP-LEFT: 02 · MEMORY                                                 -->
  <!-- ===================================================================== -->
  <g transform="translate(32, 72)">
    <rect x="5" y="5" width="244" height="132" class="shadow"/>
    <rect x="0" y="0" width="244" height="132" class="card"/>
    <rect x="0" y="0" width="244" height="28" fill="#eaeaea" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="19" class="mono" font-size="10.5" font-weight="700" fill="#000000" letter-spacing="0.6">02 · MEMORY</text>
    <rect x="166" y="5" width="68" height="18" fill="#000000"/>
    <text x="200" y="17" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">CONTEXT</text>

    <text x="14" y="50" class="ui" font-size="14" font-weight="800" fill="#000000">What It Remembers</text>
    <text x="14" y="68" class="ui" font-size="11" fill="#222222">Your projects, people, preferences,</text>
    <text x="14" y="83" class="ui" font-size="11" fill="#222222">and decisions you already made.</text>

    <rect x="14" y="96" width="216" height="24" fill="#f7f7f7" stroke="#000000" stroke-width="1.5"/>
    <text x="22" y="112" class="mono" font-size="9.5" font-weight="700" fill="#000000">Readable · editable · git-versioned</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM-LEFT: 03 · AUTHORITY                                           -->
  <!-- ===================================================================== -->
  <g transform="translate(32, 248)">
    <rect x="5" y="5" width="244" height="132" class="shadow"/>
    <rect x="0" y="0" width="244" height="132" class="card"/>
    <rect x="0" y="0" width="244" height="28" fill="#eaeaea" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="19" class="mono" font-size="10.5" font-weight="700" fill="#000000" letter-spacing="0.6">03 · AUTHORITY</text>
    <rect x="166" y="5" width="68" height="18" fill="#000000"/>
    <text x="200" y="17" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">AGENCY</text>

    <text x="14" y="50" class="ui" font-size="14" font-weight="800" fill="#000000">What It Can Do</text>
    <text x="14" y="68" class="ui" font-size="11" fill="#222222">Runs commands, edits files, drives</text>
    <text x="14" y="83" class="ui" font-size="11" fill="#222222">browsers, and sends messages.</text>

    <rect x="14" y="96" width="216" height="24" fill="#f7f7f7" stroke="#000000" stroke-width="1.5"/>
    <text x="22" y="112" class="mono" font-size="9.5" font-weight="700" fill="#000000">Acts on your machine &amp; folders</text>
  </g>

  <!-- ===================================================================== -->
  <!-- TOP-RIGHT: 04 · CONTINUITY                                            -->
  <!-- ===================================================================== -->
  <g transform="translate(604, 72)">
    <rect x="5" y="5" width="244" height="132" class="shadow"/>
    <rect x="0" y="0" width="244" height="132" class="card"/>
    <rect x="0" y="0" width="244" height="28" fill="#eaeaea" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="19" class="mono" font-size="10.5" font-weight="700" fill="#000000" letter-spacing="0.6">04 · CONTINUITY</text>
    <rect x="166" y="5" width="68" height="18" fill="#000000"/>
    <text x="200" y="17" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">RUNTIME</text>

    <text x="14" y="50" class="ui" font-size="14" font-weight="800" fill="#000000">How It Keeps Running</text>
    <text x="14" y="68" class="ui" font-size="11" fill="#222222">Schedules, heartbeats, and async</text>
    <text x="14" y="83" class="ui" font-size="11" fill="#222222">tasks that work while you sleep.</text>

    <rect x="14" y="96" width="216" height="24" fill="#f7f7f7" stroke="#000000" stroke-width="1.5"/>
    <text x="22" y="112" class="mono" font-size="9.5" font-weight="700" fill="#000000">Survives provider shutdowns</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM-RIGHT: 05 · PERMISSIONS                                        -->
  <!-- ===================================================================== -->
  <g transform="translate(604, 248)">
    <rect x="5" y="5" width="244" height="132" class="shadow"/>
    <rect x="0" y="0" width="244" height="132" class="card"/>
    <rect x="0" y="0" width="244" height="28" fill="#eaeaea" stroke="#000000" stroke-width="2.5"/>
    <text x="12" y="19" class="mono" font-size="10.5" font-weight="700" fill="#000000" letter-spacing="0.6">05 · PERMISSIONS</text>
    <rect x="166" y="5" width="68" height="18" fill="#000000"/>
    <text x="200" y="17" class="mono" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">BOUNDARY</text>

    <text x="14" y="50" class="ui" font-size="14" font-weight="800" fill="#000000">Who Sets the Limits</text>
    <text x="14" y="68" class="ui" font-size="11" fill="#222222">Per-tool rules, directory scopes,</text>
    <text x="14" y="83" class="ui" font-size="11" fill="#222222">and human-in-the-loop approvals.</text>

    <rect x="14" y="96" width="216" height="24" fill="#f7f7f7" stroke="#000000" stroke-width="1.5"/>
    <text x="22" y="112" class="mono" font-size="9.5" font-weight="700" fill="#000000">Enforced by your code, not ToS</text>
  </g>

  <!-- ===================================================================== -->
  <!-- BOTTOM: SWAPPABLE MODEL ENGINE BAR                                    -->
  <!-- ===================================================================== -->
  <line x1="440" y1="326" x2="440" y2="404" stroke="#000000" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#anat-arrow)"/>
  <rect x="378" y="352" width="124" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="440" y="364" class="mono" font-size="8.5" font-weight="700" fill="#000000" text-anchor="middle">API / LOCAL CALL</text>

  <g transform="translate(32, 408)">
    <rect x="5" y="5" width="816" height="54" class="shadow"/>
    <rect x="0" y="0" width="816" height="54" class="card-heavy"/>
    <rect x="0" y="0" width="236" height="54" fill="#000000"/>
    <text x="118" y="24" class="ui" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">THE ENGINE (RENTABLE)</text>
    <text x="118" y="41" class="mono" font-size="9" fill="#cccccc" text-anchor="middle">SWAPPABLE PER SESSION</text>

    <!-- Provider pills -->
    <g transform="translate(254, 13)">
      <rect x="0" y="0" width="96" height="28" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
      <text x="48" y="18" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">Claude</text>

      <rect x="108" y="0" width="96" height="28" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
      <text x="156" y="18" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">GPT</text>

      <rect x="216" y="0" width="96" height="28" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
      <text x="264" y="18" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">Gemini</text>

      <rect x="324" y="0" width="96" height="28" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
      <text x="372" y="18" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">DeepSeek</text>

      <rect x="432" y="0" width="114" height="28" fill="url(#anat-hatch)" stroke="#000000" stroke-width="2"/>
      <text x="489" y="18" class="mono" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">Local / Ollama</text>
    </g>
  </g>
</svg>
